CH.c16={n:16,e:"e4",t:"Une diplomatie altermondialiste pour la paix",teaser:"Indépendance, défense, ONU, migrations, Afrique, francophonie.",sp:["s16a","s16b","s16c","s16d","s16e","s16f","s16g","s16h","s16i","s16j","s16k","s16l"]};
CH.c17={n:17,e:"e4",t:"Europe",teaser:"Renégocier les traités (plan A), désobéir si nécessaire (plan B).",sp:["s17a","s17b"]};
CH.c18={n:18,e:"e4",t:"Nouvelles frontières de l'humanité",teaser:"Mers et océans, responsabilité maritime, espace, numérique, souveraineté.",sp:["s18a","s18b","s18c","s18d","s18e"]};

Object.assign(SP,{
 s15a:{c:"c15",n:"15.1",t:"S'organiser pour faire face aux pandémies",intro:"Tirer les leçons du Covid pour anticiper les crises sanitaires.",mez:[
  M("a","Reconstituer les capacités sanitaires stratégiques","Stocks (masques, médicaments), [[pole-medicament|pôle public du médicament]], anticipation.","La crise du Covid a révélé la dépendance et les pénuries (masques, médicaments).","Investissement",[["—","Coût des stocks et de la production publique"]],"Souverainisme sanitaire, sans pôle public.","Relocalisations ciblées.","Proche de LFI.",["Périmètre du pôle public du médicament à préciser."])
 ]},
 s15b:{c:"c15",n:"15.2",t:"Faire passer la santé d'abord et reconstruire les hôpitaux publics",intro:"Reconstruire l'hôpital et garantir l'accès aux soins partout.",mez:[
  M("a","Reconstruire l'hôpital public","100 000 soignants de plus, fin de la [[T2A]], réouverture de lits, d'urgences et de maternités.","L'hôpital est en crise (personnels, lits fermés depuis 2010) ; la [[T2A]] impose une logique de rentabilité.","Masse salariale",[["LFI","+100 000 soignants à l'hôpital"],["—","Poste très lourd"]],"Défense de l'hôpital, sans plan de cette ampleur.","Mesures incitatives (« Ma Santé 2022 »).","Proche de LFI.",["Délais de formation des soignants ; coût élevé."]),
  M("b","Garantir l'accès aux soins partout","Réguler l'installation ([[deserts-medicaux|déserts médicaux]]), viser le [[secu-integrale|100 % Sécu]], [[pole-medicament|pôle public du médicament]].","Environ 9 millions de personnes vivent dans un désert médical (DREES) ; le renoncement aux soins progresse.","Transfert / investissement",[["—","100 % Sécu : report du reste à charge vers la Sécu"]],"Contre la contrainte à l'installation.","Incitations, pas de coercition.","Proche de LFI.",["Opposition des médecins libéraux ; coût du 100 % Sécu (voir chapitre 7 pour le grand âge)."])
 ]},
 s15c:{c:"c15",n:"15.3",t:"Addictions et drogues : il faut changer de stratégie",intro:"Traiter les drogues comme un enjeu de santé publique.",mez:[
  M("a","Passer à une logique de santé publique","Légalisation encadrée du [[cannabis|cannabis]], politique de [[reduction-risques|réduction des risques]].","La prohibition est jugée inefficace et coûteuse ; LFI privilégie la [[reduction-risques|réduction des risques]].","Recettes + économies",[["—","Recettes fiscales + redéploiement policier"]],"Opposé, répression accrue.","Répression, expérimentations limitées.","Ouvert au débat.",["Modèle de distribution et prévention à définir (voir chapitres 4 et 7)."])
 ]},
 s15d:{c:"c15",n:"15.4",t:"En finir avec la malbouffe",intro:"Faire de l'alimentation un levier de santé.",mez:[
  M("a","Combattre la malbouffe","Encadrer la publicité (enfants), étiquetage, cantines bio et locales, réduire l'ultra-transformé.","La [[malbouffe]] favorise obésité et maladies chroniques ; LFI veut agir sur l'offre et la publicité.","Investissement (cantines)",[["—","Coût des cantines de qualité ; économies sanitaires"]],"Peu investi.","Mesures limitées (Nutri-Score).","Proche de LFI.",["Articulation avec l'agriculture (chapitre 13) et les libertés commerciales."])
 ]},

 s16a:{c:"c16",n:"16.1",t:"Assumer l'indépendance de la France dans le monde",intro:"Sortir de l'alignement et refuser la logique des blocs.",mez:[
  M("a","Sortir du commandement intégré de l'OTAN","Non-alignement, indépendance vis-à-vis des États-Unis.","La France est revenue dans le commandement intégré de l'[[otan|OTAN]] en 2009 ; LFI veut en sortir (voir aussi le chapitre Europe).","Sans coût direct",[["—","Choix stratégique"]],"Souverainiste, ambigu sur l'OTAN.","Atlantiste, pro-OTAN.","Plus atlantiste que LFI.",["Contexte de la guerre en Ukraine ; modalités et calendrier."])
 ]},
 s16b:{c:"c16",n:"16.2",t:"Construire une défense souveraine au service de la paix",intro:"Une défense indépendante, une dissuasion nationale, un contrôle des ventes d'armes.",mez:[
  M("a","Une défense indépendante et une dissuasion nationale","[[dissuasion|Dissuasion]] strictement nationale, pôle public de l'armement, contrôle parlementaire des ventes d'armes.","LFI veut maintenir la [[dissuasion]] sous contrôle national tout en relançant le désarmement multilatéral, et interdire les ventes d'armes aux pays en guerre.","Budget de défense",[["—","Dissuasion maintenue (poste majeur)"]],"Souverainiste, attaché à la dissuasion.","Atlantiste, défense européenne.","Atlantiste, soutien à l'Ukraine.",["Cohérence entre maintien de la dissuasion et désarmement débattue ; contrôle des ventes d'armes vs industrie."])
 ]},
 s16c:{c:"c16",n:"16.3",t:"Renforcer l'ONU pour faire vivre un monde ordonné",intro:"Privilégier le multilatéralisme onusien.",mez:[
  M("a","Refonder et renforcer l'ONU","Multilatéralisme, contre la « diplomatie des clubs » (G7).","LFI veut faire de l'ONU le cœur d'un monde « ordonné », contre les logiques de puissance.","Contributions internationales",[["—","Effet budgétaire limité"]],"Souverainiste, méfiant envers l'ONU.","Multilatéralisme dans le cadre occidental.","Proche de LFI.",["Réforme du Conseil de sécurité difficile (droit de veto)."])
 ]},
 s16d:{c:"c16",n:"16.4",t:"Agir pour le respect du droit international contre les guerres",intro:"Faire appliquer le droit international, partout et pour tous.",mez:[
  M("a","Faire respecter le droit international","Appliquer les décisions de la CPI et de la CIJ, sans « deux poids deux mesures ».","LFI dénonce l'application sélective du droit international selon les alliances.","Sans coût direct",[["—","Choix diplomatique"]],"Souverainiste, sélectif.","Aligné sur les positions occidentales.","Proche, avec nuances.",["Cohérence face aux conflits (Ukraine, Proche-Orient) et aux alliés."])
 ]},
 s16e:{c:"c16",n:"16.5",t:"Refuser le libre-échange, instaurer un protectionnisme écologique",intro:"Substituer la coopération au libre-échange dérégulé.",mez:[
  M("a","Sortir du libre-échange","Bloquer et abroger les accords ([[CETA]], [[mercosur|Mercosur]]), [[protectionnisme|protectionnisme écologique]].","LFI veut cesser d'externaliser les coûts sociaux et écologiques (voir aussi le chapitre Production).","Recettes + orientation",[["—","Dépend du cadre européen"]],"Protectionnisme national.","Libre-échange et compétitivité.","Prudent sur la sortie des accords.",["La politique commerciale est une compétence exclusive de l'UE."])
 ]},
 s16f:{c:"c16",n:"16.6",t:"Étendre les protections du droit international aux biens communs planétaires",intro:"Protéger le climat, les océans et le vivant par le droit.",mez:[
  M("a","Reconnaître les biens communs planétaires et l'écocide","Statut international des biens communs (climat, océans, Antarctique), crime d'[[ecocide|écocide]].","LFI veut inscrire la protection de la planète dans le droit international.","Sans coût direct",[["—","Mesure juridique et diplomatique"]],"Réservé.","Soutien au droit de l'environnement, sans écocide international.","Proche de LFI.",["Adoption internationale incertaine."])
 ]},
 s16g:{c:"c16",n:"16.7",t:"Pour une politique migratoire humaniste et réaliste",intro:"Accueillir dignement et s'attaquer aux causes des migrations.",mez:[
  M("a","Une politique migratoire humaniste","Sauvetage en mer, droit d'asile, voies légales, régularisations, fin du délit de solidarité.","LFI défend un accueil digne et s'oppose à la logique de fermeture (loi immigration de 2024).","Coût / recettes (travail)",[["—","Effet net débattu (coûts d'accueil vs apports)"]],"Priorité nationale, expulsions, restriction du droit du sol.","Fermeté (loi immigration 2024), quotas.","Plus modéré, entre accueil et régulation.",["Coordination européenne (Dublin) ; gestion des arrivées."]),
  M("b","S'attaquer aux causes des migrations","Agir sur les guerres, le pillage économique et le dérèglement climatique.","LFI relie migrations et désordres mondiaux (conflits, climat, commerce inégal).","Aide au développement",[["—","Réorientation de l'aide et de la diplomatie"]],"Nie ce lien.","Approche « développement/sécurité ».","Proche de LFI.",["Résultats de long terme, difficiles à mesurer."])
 ]},
 s16h:{c:"c16",n:"16.8",t:"Les Outre-mer, fer de lance d'une diplomatie écologique altermondialiste",intro:"Faire des Outre-mer des atouts diplomatiques.",mez:[

 var cards=ENJEUX.map(function(e){var chn=e.ch.map(function(c){return CH[c].n;});

}

/* ---------- carte mesure ---------- */
function measureCard(m,num,anchor,chId){
 var chi='<div class="block b-chi"><div class="bh">Chiffrage</div><table><tr><td>LFI</td><td>'+P(m.chi.lfi)+figtag(m.chi.lfi)+'</td></tr>'+m.chi.rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+P(r[1])+figtag(r[1])+'</td></tr>';}).join('')+'</table></div>';
 var opp='<div class="block b-opp"><div class="bh">Ce qu\'en disent les autres partis</div><div class="opp-row"><span class="p p-rn">RN</span><span>'+P(m.opp.rn)+'</span></div><div class="opp-row"><span class="p p-hor">Horizons</span><span>'+P(m.opp.hor)+'</span></div><div class="opp-row"><span class="p p-ps">PS</span><span>'+P(m.opp.ps)+'</span></div></div>';
 var man='<div class="block b-man"><div class="bh">Ce qui manque</div><ul>'+m.man.map(function(x){return '<li>'+P(x)+'</li>';}).join('')+'</ul></div>';
 var ctx='<div class="block b-ctx"><div class="bh">Contexte</div>'+P(m.ctx)+'</div>';
 var tools='<div class="mtools"><button class="copy" onclick="copyLink(\''+chId+'\',\''+anchor+'\')" aria-label="Copier le lien vers cette mesure">\uD83D\uDD17 copier le lien</button></div>';
 return '<div class="mez" id="'+anchor+'"><button aria-expanded="false" onclick="toggleMez(this)"><span class="mi">'+num+'</span><span><span class="mt">'+esc(m.t)+'</span><div class="ms">'+esc(m.s)+'</div></span></button><div class="body">'+ctx+chi+opp+man+tools+'</div></div>';}

/* ---------- chapitre ---------- */
function pageChapitre(id){var c=CH[id];if(!c)return pageAccueil();var e=enjOf(c.e);
 var head='<div class="crumb"><a onclick="go(\'#/\')">Accueil</a> › <a onclick="go(\'#/e/'+e.id+'\')">Enjeu '+e.num+'</a> › Chapitre '+c.n+'</div><div class="kicker">Chapitre '+c.n+' · Enjeu '+e.num+'</div><h1 style="color:'+e.color+'">'+esc(c.t)+'</h1>';
 if(c.avenir){return '<div class="wrap page">'+head+'<p class="lead">Ce chapitre sera rédigé au format complet dans un prochain lot.</p><div class="note"><b>Sous-parties prévues</b><ul style="margin:.4em 0">'+c.sp.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div><p><button class="btn" onclick="go(\'#/e/'+e.id+'\')">← Retour à l\'enjeu</button></p></div>';}
 var allsrc=[],num=0,resume='';
 var body=c.sp.map(function(sid){var sp=SP[sid];
   var cards=sp.mez.map(function(m){num++;collectSrc(m,allsrc);return measureCard(m,num,'m-'+sid+'-'+m.id,id);}).join('');
   resume+='<div class="rs-sp">'+esc(sp.n)+' · '+esc(sp.t)+'</div><ul>'+sp.mez.map(function(m){return '<li>'+esc(m.t)+'</li>';}).join('')+'</ul>';
   return '<div class="spart"><div class="sph">Sous-partie '+sp.n+'</div><h2>'+esc(sp.t)+'</h2><div class="spi">'+P(sp.intro)+'</div>'+cards+'</div>';}).join('');
 var resumeBox='<div class="resume"><div class="bh">Résumé du chapitre · '+num+' mesures</div>'+resume+'</div>';
 var figSrc=dedupSrc(allsrc);var refs=dedupSrc(c.refs||[]).filter(function(r){return !figSrc.some(function(f){return f[1]===r[1];});});
 var _li=function(s){return '<li><a href="'+s[1]+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>';};var srcbox=(figSrc.length||refs.length)?('<div class="srcbox"><div class="bh">Sources de la page</div>'+(figSrc.length?('<div class="srchd">Données chiffrées</div><ol>'+figSrc.map(_li).join('')+'</ol>'):'')+(refs.length?('<div class="srchd">Pour comprendre &amp; approfondir</div><ol>'+refs.map(_li).join('')+'</ol>'):'')+'</div>'):'<p class="figleg" style="margin-top:24px">Cette page renvoie au programme (voir <a class="term" onclick="go(\'#/sources\')">Sources</a>).</p>';
 var ord=[];ENJEUX.forEach(function(e2){e2.ch.forEach(function(x){ord.push(x);});});var pi=ord.indexOf(id),pp=pi>0?ord[pi-1]:null,pn=pi<ord.length-1?ord[pi+1]:null;
 var pager='<div class="pager">'+(pp?'<a onclick="go(\'#/c/'+pp+'\')"><div class="dir">\u2190 Chapitre '+CH[pp].n+'</div><div class="nm">'+esc(CH[pp].t)+'</div></a>':'<span></span>')+(pn?'<a class="nx" onclick="go(\'#/c/'+pn+'\')"><div class="dir">Chapitre '+CH[pn].n+' \u2192</div><div class="nm">'+esc(CH[pn].t)+'</div></a>':'<span></span>')+'</div>';
 var leg='<p class="figleg"><span class="figtag fig-est">estim.</span> estimation ou fourchette ; les autres montants renvoient \u00e0 une source dat\u00e9e (voir Sources de la page).</p>';
 return '<div class="wrap page">'+head+'<p class="lead">'+esc(c.teaser)+'</p>'+leg+body+resumeBox+pager+srcbox+'</div>';}

/* ---------- autres pages ---------- */
function pageFaisabilite(){var h='<div class="wrap page"><div class="crumb"><a onclick="go(\'#/\')">Accueil</a> › Faisabilité</div>'+
 '<div class="kicker">Dossier transversal</div><h1 style="color:var(--fa)">La faisabilité d\'ensemble</h1>'+
 '<p class="lead">Chapitre par chapitre, le dossier signale « ce qui manque ». Restent quatre questions transversales, qui conditionnent l\'ensemble du programme et se posent au-delà de chaque mesure prise isolément.</p>'+
 '<div class="spart"><div class="sph">1</div><h2>Le cadre européen</h2>'+
 '<p>C\'est le point de friction principal. Une part importante du programme se heurte au droit de l\'Union : le contrôle des mouvements de capitaux et le [[pole-bancaire|pôle public bancaire]] (libre circulation des capitaux, union bancaire), le [[protectionnisme|protectionnisme]] et la sortie des accords de libre-échange (la politique commerciale est une compétence <b>exclusive</b> de l\'UE), la reprise en main de la dette (indépendance de la [[traites-ue|BCE]]), ou encore la refonte de la [[pac|PAC]] et de la politique de la pêche. C\'est précisément ce qui justifie, chez LFI, la stratégie du [[plan-ab|plan A / plan B]] (chapitre 17).</p></div>'+
 '<div class="spart"><div class="sph">2</div><h2>Le financement d\'ensemble</h2>'+
 '<p>LFI présente un programme qu\'elle dit intégralement chiffré. Son contre-budget pour 2026 avançait de l\'ordre de <b>168 Md€ de dépenses nouvelles</b> pour <b>183,6 Md€ de recettes</b> la première année, l\'essentiel des recettes venant de la révolution fiscale (barème de l\'[[ir|IR]] plus progressif, rétablissement de l\'ISF, [[taxe-zucman|taxe Zucman]], fin de la [[flat-tax|flat tax]], lutte contre l\'évasion, [[tva|TVA]] modulée, réforme du [[cir|CIR]]).</p>'+
 '<div class="block b-ctx"><div class="bh">Ce que répond LFI</div>Le chiffrage est public et daté ; la relance par les bas revenus et l\'investissement écologique doit, selon LFI, élargir l\'activité et donc les recettes.</div>'+
 '<div class="block b-man"><div class="bh">Ce qu\'objectent les critiques</div>Des évaluateurs (par ex. l\'iFRAP, plutôt libérale) jugent les recettes surestimées (comportements d\'optimisation, fuite des capitaux, effet récessif de certaines hausses) ; d\'autres, comme l\'OFCE, nuancent selon les hypothèses. Le rendement réel de l\'impôt sur le patrimoine et de la lutte contre l\'évasion est incertain.</div></div>'+
 '<div class="spart"><div class="sph">3</div><h2>Les obstacles constitutionnels</h2>'+
 '<p>Plusieurs mesures supposent une révision de la Constitution : la 6ᵉ République, la [[regle-verte|règle verte]], l\'indépendance de la justice, l\'inscription de certains droits. Or une révision exige l\'accord du Sénat (article 89) ou un référendum. Par ailleurs, les nationalisations et les réquisitions touchent au <b>droit de propriété</b>, de valeur constitutionnelle (avec indemnisation).</p></div>'+
 '<div class="spart"><div class="sph">4</div><h2>Le calendrier et le rapport de force</h2>'+
 '<p>La mise en œuvre suppose d\'abord une majorité à l\'Assemblée, puis, pour beaucoup de mesures, un rapport de force social et européen. LFI assume une stratégie de confrontation (fin du [[49-3|49.3]], recours au [[ric|RIC]], mobilisation populaire) et une logique de « premier gouvernement » agissant vite. Ses détracteurs y voient un risque d\'instabilité et de conflit ouvert, notamment avec l\'UE ; LFI y voit la condition d\'une rupture réelle.</p></div>'+
 '<div class="srcbox"><div class="bh">Pour aller plus loin</div><ol>'+
 '<li><a href="https://melenchon2027.fr/programme2025/livre/" target="_blank" rel="noopener">L\'Avenir en commun — édition 2025 (programme chiffré)</a></li>'+
 '<li><a href="https://laec.fr/" target="_blank" rel="noopener">L\'Avenir en commun — édition 2022</a></li>'+
 '<li><a href="https://www.ofce-legislatives2024.fr/programmes/nfp.html" target="_blank" rel="noopener">OFCE — chiffrage du programme du Nouveau Front populaire</a></li>'+
 '<li><a href="https://www.ifrap.org/budget-et-fiscalite/le-vrai-cout-du-programme-du-nouveau-front-populaire" target="_blank" rel="noopener">iFRAP — évaluation critique (à lire comme telle)</a></li>'+
 '</ol></div>'+
 '<p style="margin-top:20px"><button class="btn" onclick="go(\'#/\')">← Retour à l\'accueil</button></p></div>';return P(h);}
function pageGlossaire(){return '<div class="wrap page"><div class="crumb"><a onclick="go(\'#/\')">Accueil</a> › Définitions</div><h1>Définitions</h1><p class="lead">'+Object.keys(DEFS).length+' termes du débat public et du programme, définis simplement. Les termes soulignés dans le texte ouvrent leur définition.</p><input class="gsearch" id="gs" placeholder="Filtrer un terme…" oninput="renderGloss(this.value)"><div class="glist" id="glist"></div></div>';}
function renderGloss(f){f=(f||'').trim().toLowerCase();var keys=Object.keys(DEFS).sort(function(a,b){return DEFS[a][0].localeCompare(DEFS[b][0],'fr');});var html=keys.map(function(k){var d=DEFS[k];if(f && d[0].toLowerCase().indexOf(f)<0 && d[1].toLowerCase().indexOf(f)<0)return '';return '<div class="gitem"><div class="gt">'+esc(d[0])+'</div><div class="gd">'+P(d[1])+'</div></div>';}).join('');var gl=document.getElementById('glist');if(gl)gl.innerHTML=html||'<p class="muted">Aucun terme ne correspond.</p>';}
function pageSources(){return '<div class="wrap page"><div class="crumb"><a onclick="go(\'#/\')">Accueil</a> › Sources</div><h1>Sources</h1><p class="lead">Le dossier renvoie systématiquement aux sources primaires. Deux références de base, présentes sur chaque page :</p><div class="srcbox"><div class="bh">Le programme, dans ses deux versions</div><ol><li><a href="https://laec.fr/" target="_blank" rel="noopener">L\'Avenir en commun — édition 2022 (laec.fr, texte intégral)</a></li><li><a href="https://melenchon2027.fr/programme2025/livre/" target="_blank" rel="noopener">L\'Avenir en commun — édition 2025 (melenchon2027.fr)</a></li></ol></div><p class="muted" style="margin-top:14px;font-size:14px">S\'y ajoutent, page par page, les sources spécifiques ci-dessous, citées sans doublon.</p><div class="srcbox"><div class="bh">Chiffrages et évaluations</div><ol><li><a href="https://www.institutmontaigne.org/" target="_blank" rel="noopener">Institut Montaigne — chiffrages de mesures</a></li><li><a href="https://www.ofce-legislatives2024.fr/programmes/nfp.html" target="_blank" rel="noopener">OFCE — chiffrage du Nouveau Front populaire</a></li><li><a href="https://www.ifrap.org/" target="_blank" rel="noopener">iFRAP — évaluations critiques (think tank libéral, à lire comme tel)</a></li><li><a href="https://www.ccomptes.fr/" target="_blank" rel="noopener">Cour des comptes</a></li><li><a href="https://www.senat.fr/" target="_blank" rel="noopener">Sénat — rapports budgétaires</a></li><li><a href="https://www.insee.fr/" target="_blank" rel="noopener">INSEE — statistiques publiques</a></li><li><a href="https://www.ademe.fr/" target="_blank" rel="noopener">ADEME — emplois de la transition</a></li><li><a href="https://www.rte-france.com/analyses-tendances-et-prospectives" target="_blank" rel="noopener">RTE — Futurs énergétiques 2050</a></li><li><a href="https://negawatt.org/" target="_blank" rel="noopener">négaWatt — scénario énergétique</a></li><li><a href="https://www.ove-national.education.fr/" target="_blank" rel="noopener">OVE — Observatoire de la vie étudiante</a></li><li><a href="https://www.ifop.com/" target="_blank" rel="noopener">Ifop — sondages d\'opinion</a></li><li><a href="https://www.arcom.fr/" target="_blank" rel="noopener">ARCOM — régulation de l\'audiovisuel</a></li></ol></div><div class="srcbox"><div class="bh">ONG et société civile — citées comme telles</div><ol><li><a href="https://www.bloomassociation.org/" target="_blank" rel="noopener">Bloom — pêche et océans</a></li><li><a href="https://www.defenseurdesdroits.fr/" target="_blank" rel="noopener">Défenseur des droits</a></li><li><a href="https://fondationdesfemmes.org/" target="_blank" rel="noopener">Fondation des Femmes — violences sexistes</a></li><li><a href="https://www.fondation-abbe-pierre.fr/" target="_blank" rel="noopener">Fondation Abbé Pierre — mal-logement</a></li></ol></div><p class="muted" style="font-size:13px;margin-top:14px">Les évaluations d\'ONG ou de think tanks engagés sont signalées comme telles, jamais comme neutres.</p></div>';}
function pageApropos(){return '<div class="wrap page"><div class="crumb"><a onclick="go(\'#/\')">Accueil</a> › À propos</div><h1>À propos</h1><p class="lead">Dossier pédagogique indépendant. Il n\'émane pas de La France insoumise.</p><p>Objectif : rendre lisible un programme dense en suivant sa propre architecture (4 grands ensembles, 18 chapitres pour l\'édition 2025), et en soumettant chaque mesure au même examen : contexte, chiffrage, positions des autres partis, points manquants. Les positions présentées sont celles de leurs auteurs, pas celles du dossier.</p><p class="muted" style="font-size:14px">Chiffrages issus de sources publiques (Cour des comptes, INSEE, Sénat, OFCE, Institut Montaigne…) ou du programme, datés. Les évaluations d\'ONG sont signalées comme telles.</p></div>';}

function figtag(v){return /(~|\u2248|de l'ordre|environ|selon|estim|fourchette|potentiel|d\u00e9battu|non chiffr|peu chiffr|variable|d\u00e9pend| \u00e0 | Md\u20ac| Md |plusieurs|jusqu)/i.test(v||'')?' <span class="figtag fig-est" title="Estimation, ordre de grandeur ou fourchette">estim.</span>':'';}
function toggleMez(b){var mz=b.parentNode;var o=mz.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false');}
function copyLink(ch,x){var u=location.href.split('#')[0]+'#/c/'+ch+'/'+x;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u);}else{try{prompt('Copier ce lien :',u);}catch(e){}}}

var SEARCH_IDX=null;
function buildIndex(){if(SEARCH_IDX)return SEARCH_IDX;SEARCH_IDX=[];var ord=[];ENJEUX.forEach(function(e){e.ch.forEach(function(z){ord.push(z);});});ord.forEach(function(cid){var c=CH[cid];(c.sp||[]).forEach(function(sid){var sp=SP[sid];if(!sp)return;sp.mez.forEach(function(m){var blob=[m.t,m.s,m.ctx,m.chi&&m.chi.lfi,m.opp?(m.opp.rn+' '+m.opp.hor+' '+m.opp.ps):'',(m.man||[]).join(' '),sp.t,c.t].join(' ').toLowerCase();SEARCH_IDX.push({ch:cid,chn:c.n,sp:sp.t,mt:m.t,ms:m.s,anchor:'m-'+sid+'-'+m.id,blob:blob});});});});return SEARCH_IDX;}
function pageSearch(q){return '<div class="wrap page"><div class="crumb"><a onclick="go(\'#/\')">Accueil</a> \u203a Recherche</div><h1>Recherche</h1><input class="gsearch" id="sq" placeholder="Rechercher une mesure, un mot-cl\u00e9\u2026" value="'+esc(q||'')+'" oninput="liveSearch(this.value)"><div id="sresults" style="margin-top:14px"></div></div>';}
function liveSearch(q){var box=document.getElementById('sresults');if(!box)return;q=(q||'').trim().toLowerCase();if(q.length<2){box.innerHTML='<p class="muted">Tapez au moins deux caract\u00e8res.</p>';return;}var terms=q.split(/\s+/);var res=buildIndex().filter(function(it){return terms.every(function(t){return it.blob.indexOf(t)>-1;});});if(!res.length){box.innerHTML='<p class="muted">Aucune mesure ne correspond \u00e0 \u00ab '+esc(q)+' \u00bb.</p>';return;}box.innerHTML='<p class="muted" style="margin:2px 0 12px">'+res.length+' mesure'+(res.length>1?'s':'')+'</p>'+res.slice(0,80).map(function(it){return '<a class="sres" onclick="go(\'#/c/'+it.ch+'/'+it.anchor+'\')"><div class="sc">Chapitre '+it.chn+' \u00b7 '+esc(it.sp)+'</div><div class="st">'+esc(it.mt)+'</div><div class="sx">'+esc(it.ms)+'</div></a>';}).join('');}
function pageManque(){var ord=[];ENJEUX.forEach(function(e){e.ch.forEach(function(z){ord.push(z);});});var blocks=ord.map(function(cid){var c=CH[cid];var items='';(c.sp||[]).forEach(function(sid){var sp=SP[sid];if(!sp)return;sp.mez.forEach(function(m){if(!m.man||!m.man.length)return;var x='m-'+sid+'-'+m.id;items+='<div class="mq"><div class="mqc">'+esc(sp.n)+' \u00b7 '+esc(sp.t)+'</div><div class="mqt">'+esc(m.t)+'</div><ul>'+m.man.map(function(y){return '<li>'+P(y)+'</li>';}).join('')+'</ul><a class="go" onclick="go(\'#/c/'+cid+'/'+x+'\')">\u2192 voir la mesure</a></div>';});});if(!items)return '';return '<h2 style="font-size:20px;margin-top:30px;color:'+enjOf(c.e).color+'">Chapitre '+c.n+' \u2014 '+esc(c.t)+'</h2>'+items;}).join('');return '<div class="wrap page"><div class="crumb"><a onclick="go(\'#/\')">Accueil</a> \u203a Ce qui manque</div><h1>Ce qui manque</h1><p class="lead">Tous les points d\'ombre, obstacles juridiques et \u00e9l\u00e9ments laiss\u00e9s ind\u00e9termin\u00e9s, rassembl\u00e9s chapitre par chapitre \u2014 le pendant critique du dossier.</p>'+blocks+'</div>';}
function pageMethodo(){return '<div class="wrap page"><div class="crumb"><a onclick="go(\'#/\')">Accueil</a> \u203a M\u00e9thode</div><h1>M\u00e9thode &amp; \u00e0 propos</h1><p class="lead">Ce dossier est un outil p\u00e9dagogique ind\u00e9pendant. Il n\'\u00e9mane pas de La France insoumise. Son but : rendre lisible un programme dense en suivant sa propre architecture, et soumettre chaque mesure au m\u00eame examen.</p><div class="spart"><div class="sph">1</div><h2>La structure</h2><p>Le dossier suit l\'architecture officielle de l\'\u00e9dition 2025 : 4 grands ensembles, 18 chapitres, leurs sous-parties, et sous chacune les mesures. Les intitul\u00e9s reprennent ceux du programme, dans ses deux \u00e9ditions (2022 et 2025).</p></div><div class="spart"><div class="sph">2</div><h2>La grille de lecture</h2><p>Chaque mesure est examin\u00e9e sous quatre angles : le <b>contexte</b> (le probl\u00e8me et les faits dat\u00e9s), le <b>chiffrage</b> (co\u00fbt ou recettes, selon LFI et selon les \u00e9valuateurs), <b>ce qu\'en disent les autres partis</b> (RN, Horizons/majorit\u00e9, PS) et <b>ce qui manque</b> (zones d\'ombre, obstacles).</p></div><div class="spart"><div class="sph">3</div><h2>La neutralit\u00e9</h2><p>Les positions pr\u00e9sent\u00e9es sont celles de leurs auteurs, pas celles du dossier. Le ton se veut descriptif. Les positions des autres partis sont pour l\'instant r\u00e9sum\u00e9es ; elles seront \u00e9tay\u00e9es par leurs programmes r\u00e9els dans une version ult\u00e9rieure.</p></div><div class="spart"><div class="sph">4</div><h2>Les sources et les chiffres</h2><p>Les chiffrages proviennent de sources publiques (Cour des comptes, INSEE, S\u00e9nat, OFCE, Institut Montaigne, ADEME\u2026) ou du programme, et sont dat\u00e9s. Les estimations et fourchettes portent l\'\u00e9tiquette <span class="figtag fig-est">estim.</span>. Les \u00e9valuations d\'ONG ou de think tanks engag\u00e9s (Bloom, iFRAP\u2026) sont attribu\u00e9es \u00e0 leur source, jamais pr\u00e9sent\u00e9es comme neutres. Chaque page de chapitre liste ses sources, sans doublon.</p></div><p style="margin-top:20px"><button class="btn" onclick="go(\'#/sources\')">Voir toutes les sources \u2192</button></p></div>';}
function render(){var h=location.hash||'#/';window.scrollTo(0,0);var app=document.getElementById('app');var m;var tn=document.getElementById('topnav');if(tn)tn.classList.remove('open');
 if(h==='#/'){app.innerHTML=pageAccueil();setNav('#/');}
 else if((m=h.match(/^#\/e\/(\w+)/))){app.innerHTML=pageEnjeu(m[1]);setNav('');}
 else if((m=h.match(/^#\/c\/(\w+)\/([\w\-]+)/))){app.innerHTML=pageChapitre(m[1]);setNav('');openMeasure(m[2]);}
 else if((m=h.match(/^#\/c\/(\w+)/))){app.innerHTML=pageChapitre(m[1]);setNav('');}
 else if(h==='#/manque'){app.innerHTML=pageManque();setNav('#/manque');}
 else if(h==='#/methodo'){app.innerHTML=pageMethodo();setNav('#/methodo');}
 else if((m=h.match(/^#\/recherche\/(.*)$/))){var q=decodeURIComponent(m[1]);app.innerHTML=pageSearch(q);setNav('');liveSearch(q);}
 else if(h==='#/recherche'){app.innerHTML=pageSearch('');setNav('');liveSearch('');}
 else if(h==='#/faisabilite'){app.innerHTML=pageFaisabilite();setNav('#/faisabilite');}
 else if(h==='#/glossaire'){app.innerHTML=pageGlossaire();setNav('#/glossaire');renderGloss('');}
 else if(h==='#/sources'){app.innerHTML=pageSources();setNav('#/sources');}
 else if(h==='#/apropos'){app.innerHTML=pageApropos();setNav('#/apropos');}
 else {app.innerHTML=pageAccueil();setNav('#/');}}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDef();var t=document.getElementById('topnav');if(t)t.classList.remove('open');}});
window.addEventListener('hashchange',render);
window.addEventListener('scroll',function(){var st=document.documentElement.scrollTop||document.body.scrollTop;var hh=(document.documentElement.scrollHeight-document.documentElement.clientHeight)||1;document.getElementById('bar').style.width=(st/hh*100)+'%';});
render();
</script>
