<style>
:root{
  --ink:#1a1a1a; --ink2:#3d3d3d; --mut:#6b6b6b; --line:#e2ded6; --line2:#d0cabd;
  --paper:#f7f5f0; --card:#fffdf9; --wash:#efece4;
  --chi:#7C3AED; --chi-w:#f0e9fb;      /* chiffrage */
  --opp:#2563EB; --opp-w:#e6eefb;      /* positions des autres partis */
  --man:#B45309; --man-w:#f6ecdc;      /* ce qui manque */
  --rn:#1E3A8A; --hor:#0F766E; --ps:#BE185D;
  --e1:#0F766E; --e2:#B45309; --e3:#15803D; --e4:#4338CA; --fa:#334155;
  --maxw:1180px;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
/* progress + topbar */
#bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--chi),var(--opp));width:0;z-index:60;transition:width .15s}
header.top{position:sticky;top:0;z-index:50;background:rgba(247,245,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:-.01em;cursor:pointer;white-space:nowrap}
.brand .d{color:var(--chi)}
nav.main{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.main a{font-size:13.5px;color:var(--mut);text-decoration:none;padding:7px 11px;border-radius:7px;font-weight:500}
nav.main a:hover{background:var(--wash);color:var(--ink)}
nav.main a.on{color:var(--ink);background:var(--wash)}
.btn{font-family:var(--sans);cursor:pointer;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--ink2)}
.btn:hover{border-color:var(--mut)}
/* generic */
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.015em;line-height:1.15}
h1{font-size:clamp(30px,5vw,50px);margin:.2em 0 .3em}
.lead{font-size:19px;color:var(--ink2);max-width:70ch}
.muted{color:var(--mut)}
.page{padding:34px 0 90px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.crumb{font-size:13px;color:var(--mut);margin-bottom:18px;font-family:var(--mono)}
.crumb a{color:var(--mut);text-decoration:none;cursor:pointer}
.crumb a:hover{color:var(--ink);text-decoration:underline}
/* accueil hero */
.hero{padding:26px 0 8px}
.hero .tag{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--chi);border:1px solid var(--line2);border-radius:20px;padding:4px 12px;margin-bottom:18px}
.enjeux{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:30px 0}
.ej{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:20px;cursor:pointer;transition:.15s;text-decoration:none;color:inherit;display:block}
.ej:hover{transform:translateY(-3px);box-shadow:0 10px 26px -14px rgba(0,0,0,.28)}
.ej .en{font-family:var(--mono);font-size:12px;color:var(--mut)}
.ej h3{font-size:21px;margin:.25em 0 .35em}
.ej p{font-size:14px;color:var(--mut);margin:0}
.ej .cn{font-size:12.5px;color:var(--ink2);margin-top:12px;font-family:var(--mono)}
/* code lecture */
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:28px 0}
.legend div{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:middle}
.legend b{font-size:14px}
.legend p{font-size:13px;color:var(--mut);margin:.35em 0 0}
/* enjeu page: chapters */
.chaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;margin-top:24px}
.chap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer;transition:.15s;text-decoration:none;color:inherit;display:block}
.chap:hover{transform:translateY(-2px);box-shadow:0 8px 20px -14px rgba(0,0,0,.25);border-color:var(--line2)}
.chap .cnum{font-family:var(--mono);font-size:12px;color:var(--mut)}
.chap h3{font-size:18px;margin:.3em 0}
.chap .sp{font-size:13px;color:var(--mut);margin-top:8px}
.chap .avenir{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--man);background:var(--man-w);border-radius:20px;padding:2px 9px;margin-top:10px}
/* chapter page: sous-parties + measures */
.spart{margin:30px 0;border-top:1px solid var(--line);padding-top:24px}
.spart>.sph{font-family:var(--mono);font-size:12px;color:var(--mut);margin-bottom:4px}
.spart h2{font-size:24px;margin:.1em 0 .4em}
.spart .spi{color:var(--ink2);max-width:72ch;margin-bottom:16px}
.mez{border:1px solid var(--line);border-radius:11px;background:var(--card);margin:12px 0;overflow:hidden}
.mez>button{width:100%;text-align:left;background:none;border:0;padding:16px 18px;cursor:pointer;font-family:inherit;display:flex;gap:14px;align-items:flex-start}
.mez>button:hover{background:var(--wash)}
.mez .mi{font-family:var(--mono);font-size:12px;color:var(--chi);border:1px solid var(--line2);border-radius:6px;padding:2px 7px;flex:none;margin-top:2px}
.mez .mt{font-family:var(--serif);font-size:18px;font-weight:600}
.mez .ms{font-size:13.5px;color:var(--mut);margin-top:3px}
.mez .body{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
.mez.open .body{display:block;animation:fade .25s}
.mez.open .mi{background:var(--chi);color:#fff}
.block{border-radius:9px;padding:13px 15px;margin-top:14px}
.block .bh{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;font-weight:500}
.b-ctx{background:var(--wash)}
.b-chi{background:var(--chi-w)} .b-chi .bh{color:var(--chi)}
.b-opp{background:var(--opp-w)} .b-opp .bh{color:var(--opp)}
.b-man{background:var(--man-w)} .b-man .bh{color:var(--man)}
.b-chi table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.b-chi td{padding:4px 8px;border-bottom:1px solid rgba(124,58,237,.15);vertical-align:top}
.b-chi td:first-child{color:var(--mut);white-space:nowrap;font-family:var(--mono);font-size:12px}
.opp-row{display:flex;gap:8px;margin:6px 0;font-size:13.5px}
.opp-row .p{font-family:var(--mono);font-size:11px;font-weight:600;flex:none;width:74px;padding-top:1px}
.p-rn{color:var(--rn)} .p-hor{color:var(--hor)} .p-ps{color:var(--ps)}
.b-man ul{margin:.2em 0;padding-left:18px} .b-man li{margin:.25em 0;font-size:13.5px}
.term{border:0;border-bottom:1px dashed var(--chi);background:none;color:var(--chi);cursor:pointer;font:inherit;padding:0}
.term:hover{background:var(--chi-w)}
/* sources */
.srcbox{margin-top:22px;background:var(--wash);border:1px solid var(--line);border-radius:10px;padding:15px 18px}
.srcbox .bh{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.srcbox ol{margin:0;padding-left:20px}
.srcbox li{font-size:13px;margin:4px 0}
.srchd{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
.srcbox a{color:var(--opp);text-decoration:none}
.srcbox a:hover{text-decoration:underline}
/* glossaire */
.gloss dt{font-family:var(--serif);font-weight:600;font-size:16px;margin-top:16px}
.gloss dd{margin:.2em 0 0;color:var(--ink2);font-size:14.5px}
.gsearch{width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--line2);border-radius:9px;font:inherit;margin:10px 0 6px;background:var(--card)}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.gitem .gt{font-family:var(--serif);font-weight:600;font-size:17px;margin:0 0 6px}
.gitem .gd{margin:0;font-size:14px;color:var(--ink2);line-height:1.55}
/* modal def */
#modal{position:fixed;inset:0;background:rgba(20,18,14,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:14px;max-width:460px;padding:24px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
#modal h4{font-family:var(--serif);font-size:21px;margin:0 0 .3em}
#modal p{color:var(--ink2);font-size:15px;margin:0}
#modal .x{float:right;cursor:pointer;color:var(--mut);border:0;background:none;font-size:20px}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mut);font-size:13px}
.note{background:var(--man-w);border:1px solid #e7d3ad;border-radius:10px;padding:13px 16px;font-size:13.5px;color:#6b4a12;margin:18px 0}
.recap{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 20px;margin-top:28px}
.recap h3{font-size:16px;margin:0 0 12px;font-family:var(--serif)}
.recap ol{margin:0;padding-left:22px}
.recap li{margin:8px 0;font-size:14px}
.recap li b{font-weight:600}
.recap .rs{color:var(--mut)}
.resume{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 20px}
.resume .bh{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.resume .rs-sp{font-family:var(--serif);font-weight:600;font-size:15px;margin-top:12px}
.resume ul{margin:.2em 0 .2em;padding-left:20px}
.resume li{font-size:13.5px;color:var(--ink2);margin:.2em 0}
/* --- fonctionnalités --- */
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:#fff;padding:8px 14px;border-radius:0 0 8px 0;z-index:100;text-decoration:none}
.skip:focus{left:0}
*:focus-visible{outline:2px solid var(--chi);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.hdr-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.hsearch{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;width:140px;transition:width .15s}
.hsearch:focus{width:190px;border-color:var(--mut);outline:none}
.iconbtn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;color:var(--ink2);line-height:1}
.iconbtn:hover{border-color:var(--mut)}
.navtoggle{display:none}
.mez{scroll-margin-top:76px}
.mtools{display:flex;gap:14px;align-items:center;margin-top:14px}
.copy{border:0;background:none;color:var(--mut);font-size:12px;cursor:pointer;font-family:var(--mono);padding:0}
.copy:hover{color:var(--chi)}
.figtag{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:10px;margin-left:8px;vertical-align:middle}
.fig-est{background:var(--man-w);color:var(--man)}
.fig-src{background:var(--opp-w);color:var(--opp)}
.figleg{font-family:var(--mono);font-size:11px;color:var(--mut);margin:8px 0 0}
.figleg .figtag{margin-left:0;margin-right:4px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
.pager a{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-decoration:none;color:inherit;background:var(--card);cursor:pointer}
.pager a:hover{border-color:var(--mut)}
.pager .dir{font-family:var(--mono);font-size:11px;color:var(--mut)}
.pager .nm{font-family:var(--serif);font-size:15px;font-weight:600}
.pager .nx{text-align:right}
.mq{border:1px solid var(--line);border-left:4px solid var(--man);border-radius:10px;background:var(--card);padding:14px 18px;margin:12px 0}
.mq .mqc{font-family:var(--mono);font-size:11px;color:var(--mut);margin-bottom:4px}
.mq .mqt{font-family:var(--serif);font-size:16px;font-weight:600}
.mq ul{margin:.4em 0 .4em;padding-left:18px}.mq li{font-size:13.5px;margin:.25em 0}
.mq .go{font-size:12px;color:var(--opp);cursor:pointer;text-decoration:none;font-family:var(--mono)}
.sres{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:13px 17px;margin:10px 0;cursor:pointer;display:block;text-decoration:none;color:inherit}
.sres:hover{border-color:var(--mut)}
.sres .sc{font-family:var(--mono);font-size:11px;color:var(--mut)}
.sres .st{font-family:var(--serif);font-size:16px;font-weight:600;margin:2px 0}
.sres .sx{font-size:13px;color:var(--ink2)}
mark.hl{background:#fde68a;padding:0 2px;border-radius:2px}
@media print{
 #bar,header.top,footer,.pager,.mtools,.crumb{display:none!important}
 .mez .body{display:block!important}
 .mez{break-inside:avoid;border-color:#ccc;margin:8px 0}
 body{background:#fff;font-size:12px}
 .page{padding:0}
 a{color:#000;text-decoration:none}
}
@media(max-width:640px){
 .navtoggle{display:inline-block}
 nav.main{position:absolute;top:54px;right:12px;left:12px;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:none;box-shadow:0 14px 34px -14px rgba(0,0,0,.35)}
 nav.main.open{display:flex}
 nav.main a{padding:11px 12px}
 .top .wrap{height:54px}
 .hsearch{width:96px}.hsearch:focus{width:120px}
}
</style>

  Dossier pédagogique et indépendant · décryptage neutre du programme de La France insoumise (éditions 2022 et 2025).
  Ce site n'émane pas de LFI. Chaque mesure renvoie aux sources primaires.

<script>

const DEFS = {
  "Ve-Republique":["Vᵉ République","Le régime politique de la France depuis 1958. Il donne un rôle central au président de la République. LFI le juge trop « présidentiel » et veut le remplacer."],
  "VIe-Republique":["VIᵉ République","Nouveau régime que propose LFI, rééquilibrant les pouvoirs vers le Parlement et les citoyens, rédigé par une [[constituante|Assemblée constituante]]."],
  "constituante":["Assemblée constituante","Assemblée élue spécialement pour écrire une nouvelle Constitution, distincte des députés en place. Le texte est ensuite soumis à référendum."],
  "RIC":["Référendum d'initiative citoyenne (RIC)","Dispositif permettant aux citoyens, à partir d'un nombre de signatures, de déclencher un référendum : proposer une loi, en abroger une, ou révoquer un élu. Revendication née des Gilets jaunes (2018-2019)."],
  "49-3":["Article 49.3","Disposition permettant au gouvernement de faire adopter un texte sans vote, sauf motion de censure. Utilisé pour la [[reforme-2023|réforme des retraites 2023]]. LFI veut en supprimer l'usage."],
  "article-89":["Article 89","Procédure de révision de la Constitution : vote en termes identiques par l'Assemblée et le Sénat, puis référendum ou Congrès. Principal verrou juridique d'une VIᵉ République."],
  "article-55":["Article 55","Article plaçant les traités internationaux (dont le droit européen) au-dessus des lois françaises. Il fonde la [[primaute-UE|primauté du droit de l'UE]]."],
  "primaute-UE":["Primauté du droit de l'UE","En cas de conflit, le droit européen l'emporte sur la loi nationale : un juge doit écarter la loi qui le contredit."],
  "pacte-stabilite":["Pacte de stabilité","Règles budgétaires européennes limitant le déficit (3 % du PIB) et la dette (60 %). Suspendues pendant le Covid, réformées en 2024. LFI veut s'en affranchir."],
  "detaches":["Travailleurs détachés","Salariés employés dans un pays de l'UE et envoyés travailler dans un autre. La directive qui les encadre est critiquée pour la concurrence sur les salaires."],
  "OTAN":["OTAN (commandement intégré)","Alliance militaire occidentale. La France est revenue dans son commandement intégré en 2009. LFI veut en sortir sans quitter l'alliance."],
  "SMIC":["SMIC","Salaire minimum légal. Toute hausse relève les bas salaires mais renchérit le coût du travail, d'où un débat sur ses effets sur l'emploi."],
  "ISF":["ISF (impôt sur la fortune)","Impôt sur les grands patrimoines, supprimé en 2018 et remplacé par l'[[IFI]]. LFI veut le rétablir et l'élargir."],
  "IFI":["IFI","Impôt sur la fortune immobilière, créé en 2018 pour remplacer l'ISF. Il ne taxe que l'immobilier, pas les placements financiers."],
  "flat-tax":["Flat tax (PFU)","Prélèvement forfaitaire unique de 30 % sur les revenus du capital, instauré en 2018. LFI veut le supprimer pour revenir à un barème progressif."],
  "exit-tax":["Exit tax","Impôt sur les plus-values latentes de ceux qui transfèrent leur domicile fiscal hors de France, pour limiter l'exil fiscal."],
  "superprofits":["Superprofits","Bénéfices exceptionnels liés à une conjoncture (ex. crise énergétique). LFI veut les taxer spécifiquement."],
  "zucman":["Taxe Zucman","Impôt plancher de 2 % sur les patrimoines de plus de 100 M€, du nom de l'économiste Gabriel Zucman. Adoptée à l'Assemblée en février 2025, rejetée par le Sénat en juin 2025."],
  "CVAE":["CVAE","Cotisation sur la valeur ajoutée des entreprises : l'un des principaux [[impots-production|impôts de production]]. Sa baisse est défendue à droite."],
  "impots-production":["Impôts de production","Impôts payés par les entreprises sur leur activité, indépendamment du bénéfice. Réputés plus élevés en France qu'ailleurs en Europe."],
  "garantie-emploi":["Garantie d'emploi","L'État propose un emploi utile à toute personne durablement sans travail (« employeur en dernier ressort »). Préfigurée par l'expérimentation « Territoires zéro chômeur »."],
  "repartition":["Système par répartition","Système de retraite français : les cotisations des actifs paient directement les pensions des retraités. S'oppose à la [[capitalisation]]."],
  "capitalisation":["Capitalisation","Chacun épargne pour sa propre retraite via des placements financiers. Défendue partiellement par Horizons, en complément de la répartition."],
  "annuites":["Annuités","Nombre d'années de cotisation exigées pour une retraite à taux plein. LFI veut revenir à 40 ; la [[touraine|réforme Touraine]] les a portées à 43."],
  "penibilite":["Pénibilité","Exposition à des conditions de travail usantes. Sa prise en compte permet des départs anticipés ; plusieurs critères ont été supprimés en 2017."],
  "reforme-2023":["Réforme des retraites 2023","Réforme dite « Borne » reculant l'âge légal de 62 à 64 ans, adoptée via le 49.3 le 16 mars 2023. LFI veut l'abroger."],
  "touraine":["Réforme Touraine","Réforme de 2014 (gouvernement socialiste) allongeant la durée de cotisation à 43 annuités. Le PS la conserve ; LFI veut revenir à 40."],

  "T2A":["Tarification à l'activité (T2A)","Financement des hôpitaux où chaque acte rapporte un tarif. Accusée de pousser à la « rentabilité » au détriment du soin ; LFI veut la supprimer."],
  "planification":["Planification écologique","Pilotage par l'État d'une transformation programmée de l'économie (énergie, transports, agriculture) pour atteindre des objectifs climatiques."],
  "regle-verte":["Règle verte","Principe de LFI : ne pas prélever à la nature plus qu'elle ne peut reconstituer. LFI veut l'inscrire dans la Constitution."],
  "EnR":["Énergies renouvelables (EnR)","Sources qui se reconstituent : solaire, éolien, hydraulique, biomasse. Environ 15 % de l'énergie finale en France."],
  "EPR":["EPR / EPR2","Réacteurs nucléaires de nouvelle génération. L'EPR de Flamanville, raccordé fin 2024 avec 12 ans de retard, a coûté ~23,7 Md€ (Cour des comptes, 2025) contre 3,3 Md€ prévus. Les « EPR2 » sont les futurs réacteurs projetés."],
  "RTE":["RTE","Gestionnaire du réseau de transport d'électricité. Ses « Futurs énergétiques 2050 » (2021) sont l'étude de référence sur les scénarios de mix électrique."],
  "negawatt":["négaWatt","Association d'experts défendant un scénario 2050 fondé sur la [[sobriete|sobriété]], l'efficacité et 100 % d'[[EnR|énergies renouvelables]], sans nucléaire."],
  "shift":["The Shift Project","Think tank sur la décarbonation, présidé par Jean-Marc Jancovici. Son « Plan de transformation » insiste sur la sobriété ; il est plutôt ouvert au nucléaire, contrairement à négaWatt."],
  "ADEME":["ADEME","Agence de la transition écologique. Elle a conclu en 2015 qu'un mix électrique 100 % renouvelable était techniquement atteignable."],
  "ASN":["ASN","Autorité de sûreté nucléaire. Elle rappelle que la prolongation des réacteurs au-delà de 50-60 ans n'est jamais acquise."],
  "sobriete":["Sobriété énergétique","Réduction volontaire de la consommation d'énergie (usages, modes de vie), distincte de l'efficacité. Pilier des scénarios négaWatt et Shift Project."],
  "neutralite-carbone":["Neutralité carbone","Équilibre entre les émissions de gaz à effet de serre et ce qui peut être absorbé. La France vise la neutralité en 2050."],
  "metiers-tension":["Métiers en tension","Secteurs peinant à recruter. La loi de janvier 2024 permet d'y régulariser des travailleurs sans-papiers sous conditions."],
  "droit-du-sol":["Droit du sol","Règle par laquelle un enfant né en France de parents étrangers peut devenir français. Le RN veut le supprimer ; LFI le défend."],
  "AES":["Régularisation (AES)","Admission exceptionnelle au séjour : régulariser un étranger sans-papiers, notamment par le travail. Les régularisations ont baissé depuis la loi de 2024."],
  "CRA":["Centre de rétention (CRA)","Lieu où sont enfermés des étrangers en attente d'éloignement. LFI veut mettre fin à l'enfermement des enfants."],
  "AME":["Aide médicale d'État (AME)","Dispositif couvrant les soins des étrangers en situation irrégulière. Régulièrement visé par la droite ; défendu par la gauche comme enjeu de santé publique."],
  "offre-demande":["Politique de l'offre / de la demande","Deux visions : soutenir les entreprises (baisser coûts et impôts) pour produire — l'offre ; ou soutenir la consommation (salaires, dépense publique) — la demande. LFI mise sur la demande."],
  "keynes":["Keynésianisme","Courant selon lequel la dépense publique et le soutien à la demande peuvent relancer l'activité et l'emploi, surtout en sous-emploi."],
  "deficit":["Déficit public","Écart annuel entre recettes et dépenses des administrations. ~5,1 % du PIB en 2025, au-dessus du seuil européen de 3 %."],
  "dette":["Dette publique","Total emprunté par les administrations. ~115,6 % du PIB en 2025 : l'un des niveaux les plus élevés de la zone euro."],
  "police-proximite":["Police de proximité","Modèle policier ancré dans les quartiers, centré sur la prévention. Supprimé en 2003 ; LFI veut le rétablir."],
  "BAC-BRAVM":["BAC & BRAV-M","Brigades anticriminalité et Brigades de répression des actions violentes motorisées : unités d'intervention que LFI veut démanteler."],
  "IGPN":["IGPN","Inspection générale de la police nationale, la « police des polices ». LFI veut la rendre indépendante du ministère de l'Intérieur."],
  "LBD":["LBD & armes de force intermédiaire","Lanceur de balles de défense (LBD 40), grenades, Taser utilisés en maintien de l'ordre. LFI veut les interdire au profit de la désescalade."],
  "salles-conso":["Salles de consommation à moindre risque","Lieux encadrés où les usagers de drogues consomment sous supervision sanitaire. LFI veut les généraliser."],
  "cazeneuve":["Loi de 2017 sur le refus d'obtempérer","Loi élargissant les cas d'usage des armes par les forces de l'ordre, surnommée « permis de tuer » par ses opposants. LFI veut l'abroger."],
  "prix-planchers":["Prix planchers","Prix de vente minimum garanti aux agriculteurs, couvrant leurs coûts. Défendu par LFI, le PS, les Écologistes et le RN."],
  "PAC":["PAC","Politique agricole commune : premier poste de dépense de l'UE (~58 Md€/an ; ~9,5 Md€/an pour la France). Aides versées surtout à l'hectare."],
  "aides-hectare":["Aides à l'hectare / à l'actif","La PAC verse des aides proportionnelles à la surface (à l'hectare), favorisant les grandes exploitations. LFI veut basculer vers des aides « à l'actif », par travailleur."],
  "clauses-miroirs":["Clauses miroirs","Imposer aux produits importés les mêmes normes qu'aux producteurs français, pour éviter une concurrence déloyale."],
  "glyphosate":["Glyphosate & néonicotinoïdes","Herbicide (classé « cancérogène probable » par le CIRC en 2015) et insecticides « tueurs d'abeilles ». LFI veut les interdire immédiatement."],
  "egalim":["Lois Egalim","Lois (2018, 2021...) censées garantir un meilleur revenu aux agriculteurs dans les négociations avec la distribution ; jugées peu efficaces."],
  "reforme-agraire":["Réforme agraire","Politique facilitant l'accès à la terre (foncier) et sa redistribution, pour installer de nouveaux paysans."],
  "vie-chere":["Vie chère","Prix nettement plus élevés dans les outre-mer qu'en métropole, surtout sur l'alimentation : éloignement, importations, concentration de la distribution."],
  "continuite-territoriale":["Continuité territoriale","Réduire, par des aides et tarifs réglementés, le coût des transports entre l'Hexagone et les outre-mer."],
  "octroi-de-mer":["Octroi de mer","Taxe sur les marchandises dans les outre-mer : recette essentielle des collectivités, mais aussi facteur de vie chère."],
  "RUP":["Régions ultrapériphériques (RUP)","Statut européen des outre-mer, ouvrant des adaptations des règles de l'UE tout en les y maintenant."],
  "chlordecone":["Chlordécone","Pesticide utilisé aux Antilles jusqu'en 1993, responsable d'une pollution durable des sols et d'un scandale sanitaire ; non-lieu de la justice en 2023."],
  "convention-climat":["Convention citoyenne pour le climat","Assemblée de 150 citoyens tirés au sort (2019-2020) chargée de propositions climatiques ; ses conclusions n'ont été reprises que partiellement."],
  "cedh":["CEDH","Cour européenne des droits de l'homme. Elle a plusieurs fois condamné la France pour la rétention administrative d'enfants."],
  "grece-2015":["Grèce 2015","La gauche radicale (Syriza) au pouvoir a organisé un référendum contre l'austérité, puis a dû s'y plier face aux créanciers européens (« troïka »). Précédent souvent cité pour le « plan B »."],
  "IVG-constit":["IVG dans la Constitution","Le droit à l'IVG a été inscrit dans la Constitution française en mars 2024. LFI veut le rendre effectif partout (un centre par hôpital) et gratuit."],
  "PMA":["PMA / GPA","La procréation médicalement assistée a été ouverte aux couples de femmes et aux femmes seules en 2021. LFI veut en améliorer l'accès (dont les personnes trans) mais refuse la gestation pour autrui (GPA)."],
  "audiovisuel-public":["Audiovisuel public","France Télévisions, Radio France, Arte, l'INA... Financé par la redevance jusqu'à sa suppression en 2022, il subit depuis des coupes budgétaires. LFI veut un financement dédié et pérenne."],
  "concentration-medias":["Concentration des médias","En France, une poignée de milliardaires (Bolloré, Arnault, Niel, Drahi, Saadé...) contrôle une grande part des médias. LFI veut une loi anti-concentration."],
  "GAFAM":["GAFAM","Google, Apple, Facebook (Meta), Amazon, Microsoft : les géants américains du numérique. LFI veut réduire la dépendance de l'État et des citoyens à leur égard."],
  "logiciel-libre":["Logiciel libre","Logiciel dont le code est ouvert, modifiable et partageable. LFI veut le généraliser dans les administrations et l'école, via une agence publique."],
  "neutralite-net":["Neutralité du Net","Principe selon lequel tous les contenus circulent de façon égale sur Internet, sans discrimination par les opérateurs. LFI veut la garantir."],
  "souverainete-num":["Souveraineté numérique","Capacité d'un pays à maîtriser ses infrastructures, ses données et ses outils numériques sans dépendre de puissances ou d'entreprises étrangères."],
  "ZEE":["Zone économique exclusive (ZEE)","Espace maritime (jusqu'à 200 milles des côtes) où un État a des droits exclusifs. Grâce aux outre-mer, la France possède la 2ᵉ ZEE du monde (~11 millions de km²)."],
  "chalutage":["Chalutage de fond","Technique de pêche industrielle traînant un filet lesté sur les fonds marins, très destructrice pour les écosystèmes. LFI veut l'interdire dans les aires marines protégées."],
  "AMP":["Aires marines protégées (AMP)","Zones censées protéger la biodiversité marine. En France, le chalutage y reste largement autorisé, d'où la critique d'une protection « en trompe-l'œil »."],
  "garantie-autonomie":["Garantie d'autonomie","Allocation que LFI veut verser aux 18-25 ans détachés du foyer fiscal, au niveau du seuil de pauvreté (de l'ordre de 1 100 €/mois), pour vivre et étudier sans précarité."],
  "GUL":["Garantie universelle des loyers (GUL)","« Sécurité sociale du logement » : une caisse solidaire couvrirait les impayés de loyers, sécurisant à la fois locataires et propriétaires."],
  "kasbarian":["Loi Kasbarian","Loi de 2023 durcissant la lutte contre les squats et les impayés locatifs, que la gauche accuse de « criminaliser » les locataires en difficulté. LFI veut l'abroger."],
  "SRU":["Loi SRU","Loi de 2000 imposant aux communes un quota de logements sociaux (20-25 %). LFI veut la maintenir et durcir les sanctions contre les communes récalcitrantes."],
  "ELAN":["Loi ELAN","Loi de 2018 sur le logement, que LFI critique notamment pour avoir facilité la vente de logements sociaux."],
  "recepisse":["Récépissé de contrôle d'identité","Document qui serait remis à chaque personne contrôlée par la police, pour tracer les contrôles et réduire ceux « au faciès ». Réclamé par le Défenseur des droits, défendu par LFI, écarté par les gouvernements successifs."],
  "commissariat-egalite":["Commissariat à l'égalité","Autorité que LFI veut créer pour coordonner la lutte contre toutes les discriminations, dotée d'inspecteurs et d'un pouvoir de sanction, reprenant notamment les missions de la DILCRAH."],
  "testing":["Testing","Méthode consistant à envoyer des candidatures comparables (emploi, logement) ne différant que par un critère (origine, sexe...) pour détecter les discriminations. LFI veut le généraliser."],
  "AAH":["AAH","Allocation aux adultes handicapés. Son montant reste inférieur au seuil de pauvreté. Sa « déconjugalisation » (ne plus tenir compte des revenus du conjoint) n'est entrée en vigueur qu'en octobre 2023 ; LFI veut la revaloriser et l'individualiser pleinement."],
  "loi-2005":["Loi handicap de 2005 (accessibilité)","Loi du 11 février 2005 posant l'obligation d'accessibilité des lieux publics et des transports. Ses objectifs sont, vingt ans après, loin d'être atteints ; LFI veut une accessibilité universelle réellement sanctionnée."],
  "T2A":["T2A (tarification à l'activité)","Mode de financement des hôpitaux, introduit en 2004, qui rémunère à l'acte. Accusé d'imposer une logique de rentabilité et de « tri » des patients. LFI veut en sortir."],
  "pole-public-bancaire":["Pôle public bancaire","Regroupement d'établissements publics (Banque postale, CNP, Bpifrance...) que LFI veut créer pour orienter le crédit vers des projets utiles et limiter la spéculation."],
  "TTF":["Taxe sur les transactions financières","Petite taxe sur les échanges de titres financiers. LFI veut l'élargir pour freiner la spéculation et dégager des recettes ; un projet de TTF européenne est en discussion."],
  "parcoursup":["Parcoursup","Plateforme d'affectation dans l'enseignement supérieur, accusée d'instaurer une sélection à l'entrée de l'université. LFI veut la démanteler pour garantir l'accès sans sélection."],
  "LPR":["Loi de programmation de la recherche","Loi de programmation de la recherche pour 2021-2030, contestée par une partie du monde académique (précarité, financement par appels à projets). LFI veut l'abroger."],
  "protectionnisme":["Protectionnisme écologique et solidaire","Politique consistant à taxer ou restreindre les importations selon leurs coûts sociaux et écologiques (taxe kilométrique, droits de douane écologiques), pour relocaliser sans « dumping »."],
  "CETA":["CETA","Accord de libre-échange entre l'UE et le Canada. LFI s'y oppose et a contribué au blocage de sa ratification en France, y voyant une menace pour l'agriculture et les normes."],
  "mercosur":["Accord UE-Mercosur","Projet d'accord de libre-échange entre l'UE et plusieurs pays d'Amérique du Sud. Combattu par LFI (et une partie du monde agricole) pour ses effets sur l'agriculture et le climat."],
  "otan":["OTAN","Alliance militaire atlantique. La France est revenue dans son commandement intégré en 2009 ; LFI veut en sortir, au nom de l'indépendance et du non-alignement."],
  "dissuasion":["Dissuasion nucléaire","Arme nucléaire française (moins de 300 ogives), présentée comme la « clef de voûte » de la défense. LFI veut la maintenir sous contrôle strictement national tout en relançant le désarmement multilatéral."]

const SP={
 s1a:{c:"c1",n:"1.1",t:"Réunir une Assemblée constituante (6ᵉ République)",intro:"Refonder les institutions en confiant l'écriture d'une 6ᵉ République à une assemblée élue, puis au référendum.",mez:[
  M("a","Convoquer une Assemblée constituante","Une assemblée élue rédige une nouvelle Constitution, ratifiée par référendum.","Abstention record, défiance, usage répété du [[49-3|49.3]] (dont la réforme des retraites en 2023) : LFI y voit une crise de régime.","Coût d'organisation modéré",[["—","Élection + référendum ; pas de coût pérenne"]],"Non : réformes ciblées, sans nouvelle République.","Non : attaché à la Vᵉ République.","Ouvert à une réforme, prudent sur la constituante.",["Le contenu de la future Constitution est laissé à la constituante : le programme fixe la méthode, pas le résultat.","Calendrier et articulation avec les institutions actuelles à préciser."]),
  M("b","Garantir l'indépendance de la constituante","Membres non rééligibles à l'assemblée suivante, parité, non-professionnels de la politique.","Pour éviter que la constituante ne serve les intérêts des élus en place, LFI veut des constituant·es détaché·es de leur avenir électoral.","Sans coût",[["—","Mesure de procédure"]],"Non concerné (rejette la constituante).","Non concerné.","Prudent.",["Les modalités concrètes (tirage au sort partiel ?) restent ouvertes."])
 ]},
 s1b:{c:"c1",n:"1.2",t:"Abolir la monarchie présidentielle",intro:"Rééquilibrer les pouvoirs au profit du Parlement et des citoyens, contre la concentration à l'Élysée.",mez:[
  M("a","Supprimer le 49.3 et encadrer les ordonnances","Fin de l'adoption des lois sans vote et limitation des ordonnances.","Le [[49-3|49.3]] a permis d'adopter la réforme des retraites sans vote en 2023 ; les [[ordonnances]] contournent le Parlement.","Sans coût",[["—","Mesure institutionnelle"]],"Garde un exécutif fort, mais défend la proportionnelle.","Défend les outils du parlementarisme rationalisé.","Favorable à encadrer le 49.3.",["Le détail relève de la constituante.","Risque d'instabilité parlementaire mis en avant par les opposants."]),
  M("b","Instaurer la proportionnelle","Élire les députés au scrutin [[proportionnelle|proportionnel]] pour représenter le pluralisme.","Le scrutin majoritaire actuel sur- ou sous-représente fortement certains courants.","Sans coût",[["—","Mesure électorale"]],"Favorable à la proportionnelle.","Ouvert à une dose de proportionnelle.","Favorable.",["Le risque d'éclatement / d'ingouvernabilité est débattu."]),
  M("c","Droit de vote à 16 ans et vote blanc","Abaisser le droit de vote à 16 ans, reconnaître le [[vote-blanc|vote blanc]].","LFI veut élargir la participation démocratique et prendre en compte l'abstention et le rejet.","Sans coût",[["—","Mesure électorale"]],"Opposé au vote à 16 ans.","Réservé.","Plutôt favorable.",["Effets sur la participation incertains."])
 ]},
 s1c:{c:"c1",n:"1.3",t:"Balayer l'oligarchie, abolir les privilèges de la caste",intro:"Rompre la confusion entre pouvoir économique et pouvoir politique.",mez:[
  M("a","Encadrer le lobbying et le pantouflage","Transparence du [[lobbying]], contrôle du [[pantouflage]], renforcement de la [[hatvp|HATVP]].","Les allers-retours public-privé et l'influence des groupes d'intérêts nourrissent la défiance.","Économies modestes",[["—","Effet budgétaire limité"]],"Discours anti-élites, peu de mesures concrètes.","Juge les dispositifs (HATVP) suffisants.","Proche de LFI.",["Effectivité dépendante des moyens de contrôle."]),
  M("b","Limiter le cumul des mandats dans le temps","Interdire d'enchaîner trop de mandats identiques.","LFI veut lutter contre la professionnalisation de la politique ([[cumul-mandats|cumul dans le temps]]).","Sans coût",[["—","Mesure statutaire"]],"Opposé.","Réservé.","Partiellement favorable.",["Seuils et exceptions à définir."]),
  M("c","Réduire le train de vie de l'État","Supprimer certains privilèges (anciens présidents, hauts responsables).","Mesure symbolique de rupture avec les « privilèges de la caste ».","Économies modestes",[["—","Montant non chiffré"]],"Discours proche, peu d'actes.","Réservé.","Proche.",["Le chiffrage des économies n'est pas détaillé."])

Object.assign(DEFS,{
 "illettrisme":["Illettrisme","Difficulté à lire et écrire malgré une scolarisation. Environ 2,5 millions d'adultes seraient concernés en France. LFI veut un grand plan d'alphabétisation."],
 "petite-enfance":["Service public de la petite enfance","Réseau public de crèches et de modes d'accueil. Il manque des centaines de milliers de places ; LFI veut le créer pour garantir l'accueil de tous les jeunes enfants."],
 "point-indice":["Point d'indice","Valeur de base servant à calculer le traitement des fonctionnaires. Gelé une grande partie des années 2010-2020, d'où une perte de pouvoir d'achat que LFI veut rattraper."],
 "choc-des-savoirs":["« Choc des savoirs »","Réforme (2023-2024) instaurant notamment des groupes de niveau au collège. Contestée par une partie de la communauté éducative ; LFI veut l'abroger."],
 "formation-pro":["Formation professionnelle","Dispositifs de qualification tout au long de la vie. LFI veut un droit universel à la formation et revaloriser le lycée professionnel."],
 "cir":["Crédit d'impôt recherche (CIR)","Première dépense fiscale de l'État (~7,6 Md€/an). LFI le juge peu efficace (effet d'aubaine pour les grands groupes) et veut le conditionner, le plafonner voire l'abroger."],
 "cvec":["CVEC","Contribution de vie étudiante et de campus, payée par les étudiants. LFI veut la supprimer."],
 "conscription":["Conscription citoyenne","Service citoyen obligatoire, rémunéré, tourné vers le secours, l'écologie et le lien social, que LFI veut créer (distinct du service militaire)."],
 "ttf":["Taxe sur les transactions financières","Taxe sur les échanges de titres. LFI veut l'élargir (y compris aux opérations infrajournalières) pour freiner la spéculation et dégager des recettes."],
 "superprofits":["Superprofits","Profits exceptionnels réalisés lors de crises (énergie, transport maritime…). LFI veut les taxer spécifiquement."],
 "pole-bancaire":["Pôle public bancaire","Regroupement d'établissements publics (Banque postale, CNP, Bpifrance) pour orienter le crédit vers l'utile, que LFI veut créer."],
 "definanciarisation":["Définanciarisation","Réduire l'emprise de la finance sur l'économie réelle (dividendes, rachats d'actions, court-termisme) au profit de l'investissement productif."],
 "audit-dette":["Audit citoyen de la dette","Examen de la dette publique visant à distinguer sa part jugée « légitime » de celle qui ne le serait pas, pour en renégocier une partie."],
 "isf":["ISF","Impôt de solidarité sur la fortune, supprimé en 2018 et remplacé par l'IFI (limité à l'immobilier). LFI veut le rétablir et le renforcer."],
 "flat-tax":["Flat tax","Prélèvement forfaitaire unique (30 %) sur les revenus du capital, instauré en 2018. LFI veut le supprimer pour revenir au barème progressif."],
 "taxe-zucman":["Taxe Zucman","Impôt plancher (de l'ordre de 2 %) sur le patrimoine des ultra-riches, proposé par l'économiste Gabriel Zucman et repris par la gauche."],
 "impot-universel":["Impôt universel","Imposition des citoyens sur leurs revenus mondiaux, déduction faite de l'impôt payé à l'étranger, pour lutter contre l'exil fiscal."],
 "tva":["TVA","Taxe sur la valeur ajoutée : première recette de l'État (de l'ordre de 200 Md€). Impôt proportionnel, jugé injuste par LFI car il pèse davantage sur les ménages modestes."],
 "verrou-bercy":["Verrou de Bercy","Monopole de l'administration fiscale sur le déclenchement des poursuites pour fraude fiscale. LFI veut le lever."]
});

 ]},
 s5b:{c:"c5",n:"5.2",t:"Faire le service public de la petite enfance",intro:"Créer un vrai service public d'accueil du jeune enfant.",mez:[
  M("a","Créer un service public de la petite enfance","Développer les crèches publiques et les modes d'accueil.","Il manque des centaines de milliers de places de crèche ([[petite-enfance|petite enfance]]).","Investissement + fonctionnement",[["—","Poste lourd (création de places + personnels)"]],"Priorité nationale, pas de service public dédié.","Réforme du « service public de la petite enfance » plus modeste.","Proche de LFI.",["Nombre de places, recrutements et calendrier à chiffrer."])
 ]},
 s5c:{c:"c5",n:"5.3",t:"Reconstruire une école globale pour l'égalité et l'émancipation",intro:"Recruter, revaloriser, réduire les inégalités scolaires.",mez:[
  M("a","Recruter et revaloriser les enseignants","Plan de recrutement, hausse des salaires, rattrapage du [[point-indice|point d'indice]].","Crise d'attractivité du métier et gel du [[point-indice|point d'indice]] depuis 2010.","Masse salariale",[["LFI","+30 % de salaire, recrutements massifs"],["—","Poste lourd"]],"Autorité et fondamentaux, hausses limitées.","Revalorisations ciblées (« Pacte »).","Proche (revalorisation).",["Vivier de candidats à court terme ; coût élevé."]),
  M("b","Réduire les effectifs et garantir la gratuité","≤ 19-24 élèves par classe, scolarité jusqu'à 18 ans, gratuité réelle (cantine, fournitures).","Les inégalités scolaires restent fortes ; LFI vise une école réellement gratuite.","Investissement",[["—","Coût lié aux recrutements et à la gratuité"]],"Opposé à la gratuité élargie.","Ajustements sans réduction générale des effectifs.","Proche.",["Chiffrage de la gratuité et des créations de postes."]),
  M("c","Abroger les réformes Blanquer","Revenir sur la réforme du lycée, du bac et le [[choc-des-savoirs|« choc des savoirs »]].","Ces réformes sont contestées par une large part de la communauté éducative.","Coût variable",[["—","Surtout réglementaire"]],"Soutient les « savoirs fondamentaux » et l'autorité.","Défend les réformes récentes.","Proche.",["Stabilité à garantir après plusieurs réformes successives."])
 ]},
 s5d:{c:"c5",n:"5.4",t:"Qualifier tout le monde",intro:"Un droit universel à la qualification et à la formation.",mez:[
  M("a","Droit à la formation tout au long de la vie","Formation continue accessible, revalorisation du lycée pro.","Le lycée professionnel et la [[formation-pro|formation]] sont fragilisés par les réformes récentes.","Investissement formation",[["—","Chiffrage selon l'ampleur"]],"Priorité à l'apprentissage.","Mise sur l'apprentissage et « France Travail ».","Proche.",["Articulation avec les dispositifs existants à préciser."])
 ]},
 s5e:{c:"c5",n:"5.5",t:"Être une grande nation scientifique",intro:"Redonner à la recherche publique ses moyens et sa liberté.",mez:[
  M("a","Créer 30 000 postes et titulariser les précaires","Emplois statutaires, financements pérennes, abrogation de la [[LPR]].","La recherche souffre de précarité et d'un financement par appels à projets ; la LPR est contestée.","Postes + financements",[["LFI","30 000 postes ; recherche à 3 % du PIB"],["—","Poste lourd"]],"Peu détaillé.","Défend la LPR et le financement sur projets.","Proche de LFI.",["Chiffrage et calendrier des recrutements."]),
  M("b","Réformer le crédit d'impôt recherche","Conditionner, plafonner voire abroger le [[cir|CIR]].","Le [[cir|CIR]] est la première dépense fiscale de l'État (~7,6 Md€, Cour des comptes) ; un rapport chiffre l'effet d'aubaine à ~3 Md€, et des groupes comme Sanofi le touchent tout en supprimant des postes de recherche.","Recettes / meilleure efficacité",[["CIR","~7,6 Md€/an, +34 % depuis 2014"],["Effet d'aubaine","~3 Md€ (rapport parlementaire)"]],"Favorable au maintien du CIR.","Défend le CIR comme soutien à l'innovation.","Favorable à le conditionner.",["Le scénario retenu (conditionner vs abroger) varie selon les textes LFI."])
 ]},
 s5f:{c:"c5",n:"5.6",t:"Refonder l'enseignement supérieur",intro:"Un accès sans sélection et des moyens à la hauteur.",mez:[
  M("a","Démanteler Parcoursup et instaurer la gratuité","Accès sans sélection, gratuité licence→doctorat, suppression de la [[cvec|CVEC]].","[[parcoursup|Parcoursup]] instaure une sélection largement rejetée dans l'opinion.","Gratuité + places",[["—","Coût lié au nombre d'étudiants"]],"Pas de gratuité élargie (dont étrangers).","Défend Parcoursup.","Proche (réforme de Parcoursup).",["Régulation des capacités d'accueil après suppression de la sélection."]),
  M("b","Démocratiser l'université","Démocratie universitaire, cadre national des diplômes.","LFI veut renforcer la collégialité et l'égalité des diplômes sur le territoire.","Sans coût majeur",[["—","Mesure d'organisation"]],"Réservé.","Réservé.","Proche.",["Articulation avec l'autonomie des universités."])
 ]},
 s5g:{c:"c5",n:"5.7",t:"Créer une conscription pour le secours collectif",intro:"Un service citoyen tourné vers l'entraide, l'écologie et les secours.",mez:[
  M("a","Instaurer une conscription citoyenne","Service citoyen obligatoire, rémunéré, non militaire.","LFI propose une [[conscription]] tournée vers le secours, l'écologie et le lien social.","Coût de fonctionnement",[["—","Poste potentiellement important (indemnisation, encadrement)"]],"Préfère un service national à dimension militaire.","Soutient le SNU, formule différente.","Ouvert au débat.",["Durée, statut et coût à préciser."])
 ]},

 s6a:{c:"c6",n:"6.1",t:"Mettre au pas la finance",intro:"Reprendre le contrôle sur la finance et la spéculation.",mez:[
  M("a","Séparer les banques et taxer la spéculation","Séparer banques de dépôt et d'affaires, élargir la [[ttf|taxe sur les transactions financières]].","La crise de 2008 a montré les risques de la banque universelle.","Recettes + stabilité",[["TTF","Plusieurs Md€ selon le périmètre"]],"Souverainiste, sans séparation bancaire.","Défend le cadre européen actuel.","Partiellement favorable.",["La régulation dépend en partie de l'échelon européen."]),
  M("b","Taxer les superprofits","Taxe sur les [[superprofits|profits exceptionnels]] (énergie, maritime…).","Des secteurs ont réalisé des superprofits pendant les crises récentes.","Recettes nouvelles",[["—","Plusieurs Md€ selon le seuil"]],"Ambigu.","Opposé (contribution ponctuelle seulement).","Favorable.",["Définition du « superprofit » à cadrer."])
 ]},
 s6b:{c:"c6",n:"6.2",t:"Pour des banques au service de l'intérêt général",intro:"Orienter le crédit vers l'utile via un pôle public.",mez:[
  M("a","Créer un pôle public bancaire","Regrouper Banque postale, CNP, Bpifrance ; socialiser une partie du secteur.","LFI veut un [[pole-bancaire|pôle public bancaire]] pour financer TPE, logement et transition.","Coût des nationalisations",[["—","Non chiffré par le programme"]],"Pas de pôle public.","Opposé.","Prudent.",["Coût et modalités de socialisation non détaillés ; droit européen."])
 ]},
 s6c:{c:"c6",n:"6.3",t:"Définanciariser l'économie réelle",intro:"Remettre l'investissement productif au-dessus de la rente.",mez:[
  M("a","Encadrer dividendes et capitaux","Encadrer dividendes et rachats d'actions, contrôler les mouvements de capitaux.","La [[definanciarisation]] vise à réorienter les profits vers l'investissement et l'emploi.","Effet d'orientation",[["—","Recettes limitées"]],"Souverainiste sans contrôle des capitaux.","Opposé (libre circulation).","Partiellement favorable.",["Le contrôle des capitaux se heurte au droit de l'UE."])
 ]},
 s6d:{c:"c6",n:"6.4",t:"Refuser le chantage : annuler la dette publique",intro:"Reprendre la main sur la dette et la monnaie.",mez:[
  M("a","Restructurer la dette et auditer","[[audit-dette|Audit citoyen de la dette]], rachat/transformation par la BCE.","La dette est détenue en grande partie par les marchés ; la BCE en détient déjà une part.","Dépend du cadre européen",[["—","Non applicable unilatéralement"]],"Souverainiste, sans cadre clair.","Défend l'indépendance de la BCE.","Prudent.",["La BCE est indépendante : suppose une renégociation ou un conflit avec les traités."])
 ]},
 s6e:{c:"c6",n:"6.5",t:"Faire la révolution fiscale",intro:"Rendre l'impôt plus progressif et plus juste.",mez:[
  M("a","Un impôt sur le revenu très progressif","Barème à 14 tranches, plus progressif.","LFI veut renforcer la progressivité de l'impôt sur le revenu.","Recettes",[["—","Selon le barème retenu"]],"Opposé à une forte progressivité.","Opposé.","Favorable à plus de progressivité.",["Effet redistributif net à préciser."]),
  M("b","Rétablir l'ISF et taxer le capital","Rétablir l'[[isf|ISF]], supprimer la [[flat-tax|flat tax]], instaurer la [[taxe-zucman|taxe Zucman]], plafonner l'héritage.","L'[[isf|ISF]] a été supprimé en 2018 ; LFI veut aussi une [[taxe-zucman|taxe Zucman]] (~2 % sur les milliardaires) et un héritage maximal (~12 M€).","Recettes",[["ISF","Plusieurs Md€/an"],["Taxe Zucman","~15-25 Md€ selon les estimations"]],"Opposé au rétablissement de l'ISF.","Opposé (défend la flat tax).","Favorable à l'ISF et à la taxe Zucman.",["Rendement réel dépend des comportements d'optimisation."]),
  M("c","Rendre la TVA plus juste","Baisser la [[tva|TVA]] sur les produits de première nécessité, créer une « TVA grand luxe ».","La [[tva|TVA]] est la première recette de l'État (~200 Md€) mais un impôt proportionnel qui pèse plus sur les ménages modestes.","Neutre à négatif à court terme",[["TVA","1re recette de l'État (~200 Md€)"]],"Favorable à des baisses ciblées de TVA.","Prudent (coût budgétaire).","Favorable à moduler la TVA.",["Le coût des baisses doit être compensé (TVA grand luxe, autres recettes)."]),
  M("d","Lutter contre l'évasion et l'exil fiscal","[[impot-universel|Impôt universel]], levée du [[verrou-bercy|verrou de Bercy]], moyens de contrôle.","Des dizaines de milliards échappent chaque année à l'impôt (Cour des comptes).","Recettes",[["—","Plusieurs Md€, incertains"]],"Discours souverainiste, peu de mesures.","Action dans le cadre international/UE.","Favorable.",["Efficacité dépendante de la coopération internationale."])
 ]}
});

Object.assign(SP,{
 s7a:{c:"c7",n:"7.1",t:"L'égalité des populations par la démocratie et les services publics",intro:"Garantir l'accès de tous aux services publics, partout.",mez:[
  M("a","Rétablir les services publics de proximité","Rouvrir bureaux de poste, écoles, gares, maternités, trésoreries fermés.","Le recul des services publics de proximité alimente le sentiment d'abandon des territoires.","Investissement + fonctionnement",[["—","Poste lourd (rouvertures + effectifs)"]],"Priorité nationale, discours sur la ruralité.","Dématérialisation et regroupements.","Proche de LFI.",["Chiffrage des réouvertures et des recrutements."]),
  M("b","Stopper les privatisations","Mettre fin aux privatisations et créer un guichet unique d'accès aux droits.","LFI veut enrayer la logique de privatisation et le non-recours aux droits.","Sans coût direct majeur",[["—","Effet surtout organisationnel"]],"Sélectif.","Poursuit l'ouverture à la concurrence.","Proche.",["Périmètre des services concernés à préciser."])
 ]},
 s7b:{c:"c7",n:"7.2",t:"En finir avec l'abandon des Outre-mer",intro:"Répondre à l'urgence sociale, sanitaire et environnementale ultramarine.",mez:[
  M("a","Plan d'urgence pour les Outre-mer","Eau potable, santé, alignement des droits sociaux, réparation du [[chlordecone|chlordécone]].","En Guadeloupe, l'eau du robinet n'est pas toujours potable ; le [[chlordecone|chlordécone]] a durablement pollué les sols antillais.","Investissement",[["—","Poste lourd, peu chiffré globalement"]],"Priorité nationale, peu de plan spécifique.","Mesures ponctuelles.","Proche de LFI.",["Chiffrage et calendrier du plan à préciser."]),
  M("b","Lutter contre la vie chère","Encadrer les prix et les marges, casser les monopoles d'importation.","La [[vie-chere|vie chère]] (mobilisations de 2024 en Martinique) tient largement aux monopoles d'import.","Encadrement",[["—","Coût public faible"]],"Dénonce la vie chère sans encadrement des marges.","Négociations sur les prix (« BQP »).","Proche.",["Compatibilité de l'encadrement avec le droit de la concurrence."])
 ]},
 s7c:{c:"c7",n:"7.3",t:"Faire la société de l'entraide : généraliser l'ESS",intro:"Développer l'économie sociale, solidaire et coopérative.",mez:[
  M("a","Soutenir l'ESS et les coopératives","Statut renforcé, financement, priorité dans la commande publique.","LFI veut faire de l'[[scop|économie coopérative]] un pilier, non une marge.","Soutien public",[["—","Coût modéré"]],"Peu investi sur l'ESS.","Soutien limité.","Proche de LFI.",["Articulation avec le pôle public bancaire."]),
  M("b","Faciliter les reprises en coopérative","Droit de [[preemption|préemption]] des salariés pour reprendre en [[scop|SCOP]].","Sauver des entreprises viables menacées de fermeture.","Soutien via banque publique",[["—","Coût modéré"]],"Neutre.","Neutre.","Favorable.",["Financement de l'accompagnement à préciser."])
 ]},
 s7d:{c:"c7",n:"7.4",t:"Éradiquer la pauvreté",intro:"Sortir durablement des millions de personnes de la pauvreté.",mez:[
  M("a","Revaloriser les minima et ouvrir le RSA à 18 ans","[[garantie-dignite|Garantie dignité]] au seuil de pauvreté, [[rsa|RSA]] dès 18 ans.","Environ 9 millions de personnes vivent sous le seuil de pauvreté (INSEE) ; les moins de 25 ans n'ont pas droit au [[rsa|RSA]].","Poste social lourd",[["Garantie dignité","~1 100 €/mois (seuil de pauvreté)"],["—","Coût élevé, selon le périmètre"]],"Contre l'ouverture du RSA aux jeunes (« assistanat »).","Conditionnalité (RSA sous contrainte d'activité).","Proche de LFI.",["Coût global et articulation avec les autres prestations."]),
  M("b","Bloquer les prix de première nécessité","[[blocage-prix|Blocage]] ou encadrement des prix de l'énergie, de l'alimentation, des carburants.","Face à l'inflation, LFI veut pouvoir encadrer les prix vitaux.","Coût / manque à gagner",[["—","Variable ; compensation éventuelle"]],"Favorable à des baisses ciblées (TVA, taxes).","Opposé au blocage généralisé.","Partiellement favorable.",["Effets de bord (offre, subventions aux distributeurs) à cadrer."])
 ]},
 s7e:{c:"c7",n:"7.5",t:"Garantir le droit au logement",intro:"Face à la crise du mal-logement, réguler, construire, réquisitionner.",mez:[
  M("a","Encadrer les loyers et garantir contre les impayés","Encadrement obligatoire en zone tendue + [[GUL|garantie universelle des loyers]].","Loyers en hausse d'environ 12 % (2013-2023) et ~4 millions de mal-logés (Fondation Abbé Pierre).","Caisse solidaire",[["—","Financement mutualisé"]],"Priorité nationale pour les HLM, pas d'encadrement général.","« Choc d'offre », prudent sur l'encadrement.","Proche de LFI.",["Compensation et effet sur l'offre locative débattus."]),

 ]},
 s7f:{c:"c7",n:"7.6",t:"La justice au nom du peuple",intro:"Rendre la justice indépendante et accessible.",mez:[
  M("a","Garantir l'indépendance de la justice","Réformer le [[csm|CSM]], mettre fin à la nomination des procureurs par l'exécutif.","LFI veut couper le lien entre le parquet et le pouvoir politique.","Sans coût majeur",[["—","Réforme institutionnelle"]],"Réservé.","Réforme limitée du parquet.","Proche de LFI.",["Suppose une révision constitutionnelle (accord du Sénat)."]),
  M("b","Rendre la justice accessible","Recruter des magistrats et greffiers, revaloriser l'[[aide-juridictionnelle|aide juridictionnelle]].","La justice française est sous-dotée par rapport à ses voisines (délais, moyens).","Investissement",[["—","Poste significatif (postes)"]],"Priorité à la fermeté plus qu'aux moyens.","Hausse budgétaire engagée.","Proche.",["Ampleur des recrutements à chiffrer."])
 ]},
 s7g:{c:"c7",n:"7.7",t:"Une politique de justice efficace",intro:"Privilégier la réinsertion et des peines qui préviennent la récidive.",mez:[
  M("a","Lutter contre la surpopulation carcérale","Alternatives à l'incarcération, réinsertion, contre la [[surpopulation-carcerale|surpopulation carcérale]].","La France est régulièrement condamnée pour ses conditions de détention.","Investissement / économies",[["—","Coût de la réinsertion vs coût de la détention"]],"Priorité à l'enfermement, plus de places de prison.","Construction de places + alternatives.","Proche de LFI.",["Acceptabilité de la réduction du recours à la prison."]),
  M("b","Une justice des mineurs éducative","Priorité à l'éducatif sur le répressif pour les mineurs.","LFI défend la primauté de l'éducatif, contre le durcissement récent.","Investissement (PJJ)",[["—","Moyens de la protection judiciaire de la jeunesse"]],"Veut durcir la justice des mineurs.","Durcissement partiel.","Proche.",["Équilibre éducatif/sanction débattu."])
 ]},
 s7h:{c:"c7",n:"7.8",t:"Une police de proximité au service de la sûreté des citoyens",intro:"Recentrer la police sur la prévention et l'élucidation (voir aussi chapitre 4).",mez:[
  M("a","Rétablir la police de proximité","Réimplanter une [[police-proximite|police de proximité]] et renforcer l'enquête.","Le taux d'élucidation de nombreux délits reste faible ; la proximité fut supprimée en 2003. (Voir aussi la refondation de la police au chapitre 4.)","Redéploiement",[["—","Coût modéré (effectifs, formation)"]],"Soutien aux forces de l'ordre, plus d'effectifs.","Modernisation, police du quotidien.","Proche de LFI.",["Moyens et doctrine à préciser ; recouvre en partie le chapitre 4."]),

 ]},

 s12a:{c:"c12",n:"12.1",t:"La bifurcation écologique pour une société de l'harmonie",intro:"Faire de l'écologie la boussole de toute l'action publique.",mez:[
  M("a","Inscrire la règle verte dans la Constitution","[[regle-verte|Règle verte]] : ne pas prélever à la nature plus qu'elle ne reconstitue ; objectif -65 % d'émissions en 2030.","LFI veut placer la [[regle-verte|règle verte]] au sommet de la hiérarchie des normes et relever l'ambition climatique (−65 % en 2030, contre −50 % aujourd'hui).","Sans coût direct",[["—","Mesure constitutionnelle et d'objectifs"]],"Climato-sceptique de fait, contre les contraintes.","Objectif européen (−55 %), sans règle verte.","Favorable à une ambition climatique forte.",["La révision constitutionnelle exige l'accord du Sénat.","L'objectif −65 % suppose des mesures très rapides."]),
  M("b","Planifier par des lois-cadres démocratiques","[[planification-eco|Lois-cadres]] de planification coordonnant national et local.","La [[planification-eco|planification]] fixe des objectifs et organise l'État pour les tenir, avec arbitrages citoyens.","Coût d'organisation",[["—","Surtout institutionnel"]],"Opposé à la planification.","Préfère les incitations de marché.","Favorable à une planification.",["Articulation entre planification et libertés économiques à préciser."])
 ]},
 s12b:{c:"c12",n:"12.2",t:"L'organisation de l'État au service de la planification écologique",intro:"Donner à l'État les moyens de planifier.",mez:[
  M("a","Renforcer l'État planificateur et ses opérateurs","Conseil à la planification, moyens au Cerema, à l'[[onf|ONF]], à l'OFB, à Météo France ; rôle central des communes.","Ces opérateurs publics ont vu leurs moyens fondre ; LFI veut les renforcer et impliquer les communes.","Investissement (services publics)",[["—","~900 M€/an évoqués pour les services de la bifurcation"]],"Réduction de l'État.","Maintien, sans plan de renforcement.","Proche de LFI.",["Chiffrage global des recrutements à préciser."])
 ]},
 s12c:{c:"c12",n:"12.3",t:"Les Outre-mer, avant-postes de la planification écologique",intro:"Faire des Outre-mer les pilotes de la bifurcation.",mez:[
  M("a","S'appuyer sur les « plans pays » ultramarins","Faire des Outre-mer les pilotes (biodiversité, énergies renouvelables, autonomie alimentaire).","Les Outre-mer concentrent une biodiversité exceptionnelle et des « plans pays » déjà élaborés localement.","Investissement",[["—","Selon les plans retenus"]],"Priorité nationale, peu spécifique.","Mesures ponctuelles.","Proche de LFI.",["Moyens et gouvernance locale à préciser (voir aussi chapitre 7)."])
 ]},

 s13a:{c:"c13",n:"13.1",t:"Investir pour lancer la bifurcation de notre économie",intro:"Un plan d'investissement massif, moteur d'emplois.",mez:[
  M("a","Lancer un plan d'investissement massif","Plan de l'ordre de 200 Md€ sur cinq ans ; pôles publics (énergie, transports, santé).","Selon l'ADEME, la bifurcation énergétique pourrait créer près d'un million d'emplois.","Investissement public",[["LFI","≈ 200 Md€ sur 5 ans"],["ADEME","~1 million d'emplois potentiels"]],"Sceptique sur l'ampleur écologique.","Investissement plus modeste, via le marché.","Proche de LFI.",["Bouclage financier et rythme de décaissement (voir dossier faisabilité)."])
 ]},
 s13b:{c:"c13",n:"13.2",t:"Développer les transports publics écologiques, repenser la mobilité individuelle",intro:"Priorité au rail et aux transports du quotidien.",mez:[
  M("a","Créer un pôle public des transports","SNCF réunifiée et 100 % publique, réouverture des petites lignes et trains de nuit, refus de l'ouverture à la concurrence.","Le réseau s'est dégradé ; la dette ferroviaire (~50 Md€) a été reprise par l'État. Les transports sont le 1er secteur émetteur de GES.","Investissement ferroviaire",[["État (annoncé)","~100 Md€ d'ici 2040 déjà programmés"]],"Pro-voiture, hostile aux contraintes.","Plan ferroviaire, mais ouverture à la concurrence.","Proche de LFI.",["Coût de la régénération ; soutenabilité de la gratuité."]),
  M("b","Réduire l'aviation la plus polluante","Limiter les vols intérieurs (alternative en train), taxer le kérosène, fin des jets privés ; plan vélo.","La loi Climat (2021) n'interdit les vols intérieurs qu'en présence d'une alternative en train de moins de 2h30 ; LFI veut aller plus loin.","Recettes (kérosène)",[["—","Dépend d'accords internationaux"]],"Opposé aux restrictions.","Restrictions limitées (2h30).","Proche de LFI.",["Emploi du secteur aérien ; taxation du kérosène liée au cadre international."])
 ]},
 s13c:{c:"c13",n:"13.3",t:"Organiser le 100 % d'énergies renouvelables en 2050 et la rénovation énergétique",intro:"Un mix 100 % renouvelable et des logements isolés.",mez:[
  M("a","Passer à 100 % d'énergies renouvelables","[[enr|100 % renouvelables]] en 2050 et sortie progressive du nucléaire.","LFI vise un mix 100 % renouvelable et la sortie du [[epr|nucléaire]] (dont l'EPR de Flamanville a coûté ~23,7 Md€, 12 ans de retard, selon la Cour des comptes).","Investissement énergétique",[["—","Poste lourd (production, réseaux, stockage)"]],"Pro-nucléaire, contre l'éolien.","Relance du nucléaire (nouveaux EPR) + renouvelables.","Mix, plus ouvert au nucléaire que LFI.",["La faisabilité d'un 100 % renouvelable et le calendrier de sortie du nucléaire sont vivement débattus (voir scénarios RTE)."]),
  M("b","Rénover thermiquement tous les logements","[[renovation-thermique|Rénovation]] globale, éradication des passoires thermiques.","La [[renovation-thermique|rénovation]] réduit les factures, les émissions et crée des emplois locaux.","Investissement",[["—","Poste lourd, étalé sur le quinquennat"]],"Réservé sur les obligations.","Aides existantes (MaPrimeRénov'), sans plan global.","Proche de LFI.",["Financement, main-d'œuvre qualifiée et reste à charge des ménages."])
 ]},
 s13d:{c:"c13",n:"13.4",t:"Consommer autrement, une France « zéro déchet »",intro:"Sortir de la société du jetable.",mez:[
  M("a","Aller vers le zéro déchet","Lutte contre l'[[obsolescence|obsolescence programmée]], réemploi, réparation, consigne.","LFI veut préférer « le réparable et le durable » au tout-jetable ([[zero-dechet|zéro déchet]]).","Sans coût public majeur",[["—","Effet surtout réglementaire ; création d'emplois de réparation"]],"Peu investi.","Mesures limitées (indice de réparabilité).","Proche de LFI.",["Effet sur les filières industrielles à accompagner."])
 ]},
 s13e:{c:"c13",n:"13.5",t:"Souveraineté alimentaire et révolution agricole : pour une agriculture écologique et paysanne",intro:"Une agriculture qui nourrit la population et fait vivre les paysans.",mez:[
  M("a","Garantir des prix rémunérateurs aux paysans","[[prix-plancher|Prix planchers]], interdiction des ventes à perte, reprise des dettes des convertis au bio.","Les agriculteurs subissent des prix inférieurs à leurs coûts ; LFI veut des [[prix-plancher|prix planchers]].","Soutien public",[["—","Coût selon les dispositifs (caisse de défaisance…)"]],"Défend les agriculteurs, contre les normes écologiques.","Soutien à la « ferme France », sans prix planchers.","Proche de LFI.",["Compatibilité des prix planchers avec le droit de la concurrence de l'UE."]),
  M("b","Faire la bifurcation agricole","300 000 emplois agricoles, sortie des pesticides, refonte de la [[pac|PAC]] ([[agroecologie|agriculture écologique et paysanne]]).","L'agro-industrie détruit sols, santé et emplois ; le bio crée plus d'emplois à surface égale.","Réorientation d'aides",[["—","Réorientation de la PAC (~9,5 Md€/an, Commission européenne)"]],"Contre la sortie des pesticides.","Transition graduelle, sans rupture.","Proche de LFI.",["La refonte de la PAC dépend de l'UE ; accompagnement des agriculteurs."])
 ]},

 s14a:{c:"c14",n:"14.1",t:"Pollutions : désempoisonner le monde",intro:"Interdire les substances les plus nocives et réparer les dommages.",mez:[
  M("a","Interdire les produits chimiques les plus nocifs","Interdire les [[pfas|polluants éternels]], créer une autorité indépendante des risques industriels.","Les [[pfas|PFAS]] contaminent durablement l'eau et les organismes ; les risques industriels sont mal contrôlés.","Coût (contrôle) / santé",[["—","Économies sanitaires à terme"]],"Réservé (défense de l'industrie).","Restrictions graduelles (cadre UE).","Proche de LFI.",["Substituts industriels et calendrier d'interdiction à préciser."]),
  M("b","Réparer les dommages des essais nucléaires","Indemniser les victimes des [[essais-nucleaires|essais nucléaires]], notamment en Polynésie.","Les [[essais-nucleaires|essais nucléaires]] français ont laissé de lourdes séquelles sanitaires et environnementales.","Indemnisation",[["—","Selon le nombre de victimes reconnues"]],"Peu investi.","Dispositif d'indemnisation existant, jugé insuffisant.","Proche de LFI.",["Reconnaissance des victimes indirectes à élargir."])
 ]},
 s14b:{c:"c14",n:"14.2",t:"L'eau, enjeu central pour l'Humanité",intro:"Faire de l'eau un bien commun géré démocratiquement.",mez:[
  M("a","Gérer l'eau comme un bien commun","Gestion publique (régies), droit à l'eau, protection de la ressource ; opposition aux [[megabassines|mégabassines]].","LFI veut sortir l'eau de la logique marchande ; l'opposition aux [[megabassines|mégabassines]] a culminé à Sainte-Soline en 2023.","Investissement (réseaux)",[["—","Rénovation des réseaux (fuites) ; retour en régie"]],"Peu de position claire.","Gestion mixte, soutien à certaines retenues.","Proche de LFI.",["Coût de la rénovation des réseaux ; conflits d'usage agricoles."])
 ]},
 s14c:{c:"c14",n:"14.3",t:"Le droit à l'eau dans les Outre-mer",intro:"Garantir l'accès à l'eau potable partout en Outre-mer.",mez:[
  M("a","Plan d'urgence pour l'eau en Outre-mer","Garantir l'eau potable (Guadeloupe, Mayotte…) par un plan d'investissement.","En Guadeloupe et à Mayotte, l'accès à l'eau potable n'est pas assuré en continu.","Investissement",[["—","Poste lourd (réseaux vétustes)"]],"Priorité nationale, peu de plan.","Mesures ponctuelles.","Proche de LFI.",["Chiffrage et gouvernance locale (voir chapitres 7 et 12)."])
 ]},
 s14d:{c:"c14",n:"14.4",t:"Défendre la forêt, poumon de la planète",intro:"Une gestion publique et durable de la forêt.",mez:[
  M("a","Protéger et gérer durablement la forêt","Renforcer l'[[onf|ONF]], lutter contre les coupes rases, reboiser en diversité.","La forêt souffre du changement climatique et d'une gestion productiviste ; l'[[onf|ONF]] est affaibli.","Investissement (ONF)",[["—","Renforcement des moyens de l'ONF"]],"Peu investi.","Soutien limité.","Proche de LFI.",["Équilibre entre filière bois et protection à préciser."])
 ]},
 s14e:{c:"c14",n:"14.5",t:"Rompre avec la maltraitance animale",intro:"Améliorer la condition animale.",mez:[
  M("a","Mettre fin aux pires pratiques d'élevage","Sortir de l'[[elevage-cage|élevage en cage]], encadrer transport et abattage (contrôle vidéo).","La souffrance animale dans l'élevage intensif et les abattoirs est documentée.","Accompagnement (filières)",[["—","Coût de transition pour les éleveurs"]],"Défend l'élevage et la chasse, contre les contraintes.","Mesures limitées.","Proche de LFI.",["Accompagnement économique des éleveurs ; sujets clivants (chasse, corrida)."])
 ]},
 s14f:{c:"c14",n:"14.6",t:"Sauver l'écosystème et la biodiversité",intro:"Enrayer l'effondrement du vivant.",mez:[
  M("a","Protéger réellement la biodiversité","Aires réellement protégées, stopper l'[[artificialisation|artificialisation des sols]], protéger les océans.","Les aires « protégées » le sont souvent en trompe-l'œil (voir aussi le chapitre sur la mer, à venir).","Régulation + investissement",[["—","Coût public modéré ; enjeux fonciers"]],"Contre les contraintes (« zéro artificialisation »).","Objectif ZAN, appliqué prudemment.","Proche de LFI.",["Conflits d'usage (logement, agriculture) et compensation."])
 ]}
});


/* ===== LOT — Enjeu III (ch15) + Enjeu IV (ch16-18) ===== */
Object.assign(DEFS,{
 "secu-integrale":["Sécurité sociale intégrale (100 % Sécu)","Objectif de LFI : rembourser à 100 % par la Sécurité sociale les soins prescrits, en supprimant le reste à charge et le rôle des complémentaires."],
 "deserts-medicaux":["Déserts médicaux","Zones où l'accès à un médecin est très difficile (~9 millions de personnes concernées). LFI veut réguler l'installation des médecins dans les zones surdotées."],
 "pole-medicament":["Pôle public du médicament","Structure publique de production et de distribution de médicaments, pour lutter contre les pénuries et les prix élevés."],
 "reduction-risques":["Réduction des risques","Politique de santé publique visant à limiter les dommages liés aux drogues (plutôt que la seule répression), incluant la légalisation encadrée du cannabis."],
 "malbouffe":["Malbouffe","Alimentation ultra-transformée, riche en additifs, favorisée par le marketing. LFI veut l'encadrer (publicité, cantines, étiquetage)."],
 "ecocide":["Écocide","Atteinte grave et durable à l'environnement. LFI veut le reconnaître comme un crime, y compris en droit international."],
 "franc-cfa":["Franc CFA","Monnaie de plusieurs pays africains, arrimée à l'euro et longtemps gérée avec la France. Symbole de la « Françafrique » que LFI veut voir disparaître."],
 "francafrique":["Françafrique","Réseau d'influence néocoloniale de la France en Afrique (militaire, économique, monétaire). LFI veut y mettre fin au profit de relations d'égal à égal."],
 "ariane":["Programme spatial (Ariane)","LFI veut un pôle public spatial fort et défend l'espace comme bien commun, contre sa privatisation (type SpaceX)."],
 "plan-ab":["Plan A / plan B (Europe)","Doctrine de LFI : négocier un changement des traités européens (plan A) et, en cas d'échec, désobéir unilatéralement à certaines règles (plan B)."],
 "traites-ue":["Traités européens","Règles de l'UE (discipline budgétaire, concurrence, libre circulation des capitaux) que LFI juge incompatibles avec son programme et veut renégocier ou contourner."],
 "senne-demersale":["Senne démersale","Technique de pêche industrielle très efficace et controversée, que LFI veut interdire pour protéger la ressource."]
});
